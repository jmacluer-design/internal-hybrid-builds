<style>
/* Outbreak NUI: tokens, type scale, glass panels and the shared widgets. Everything is sized in rem so the whole UI scales with the
   viewport: 1920x1080 -> 16px rem, 2560x1440 -> 21.3px, 3840x2160 -> 32px (16:9 locked by min(vw/120, vh/67.5)). */
@font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url('fonts/inter-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 500; font-display: swap; src: url('fonts/inter-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 600; font-display: swap; src: url('fonts/inter-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 700; font-display: swap; src: url('fonts/inter-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 500; font-display: swap; src: url('fonts/barlow-condensed-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-display: swap; src: url('fonts/barlow-condensed-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-display: swap; src: url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2'); }

:root {
  --ui-scale: 1;
  --hud-opacity: 1;
  --bg0: #06090f;
  --glass-a: rgba(26, 33, 47, .80);
  --glass-b: rgba(11, 15, 23, .86);
  --glass-flat: rgba(14, 18, 27, .78);
  --stroke: rgba(255, 255, 255, .075);
  --stroke2: rgba(255, 255, 255, .15);
  --hi: rgba(255, 255, 255, .06);
  --text: #eaf0f9;
  --muted: #94a1b7;
  --dim: #62708a;
  --amber: #f6b44f;
  --amber2: #ffd38a;
  --amber-d: #b9772a;
  --teal: #3fe0c5;
  --blue: #66adff;
  --good: #35d39a;
  --warn: #f5a524;
  --bad: #ff5d6c;
  --info: #6aa8ff;
  --hp: #ff5d6c;
  --hunger: #ffa24a;
  --thirst: #47c7f5;
  --fatigue: #a78bff;
  --bleed: #ff3b5c;
  --infect: #a6e63c;
  --weight: #c9d2e3;
  --font-ui: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Inter', system-ui, sans-serif;
  --r: .75rem;
  --r-s: .5rem;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --shadow: 0 .75rem 2.5rem rgba(0, 0, 0, .5), 0 .125rem .5rem rgba(0, 0, 0, .35);
}
:root[data-cb="1"] { --good: #4aa3ff; --bad: #ffb000; --warn: #e6e6e6; --hp: #ffb000; --bleed: #ff8a00; --infect: #4aa3ff; }

html { font-size: calc(clamp(11px, min(100vw / 120, 100vh / 67.5), 48px) * var(--ui-scale)); height: 100%; }
body {
  margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--text);
  font: 400 .9375rem/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  user-select: none; -webkit-user-select: none; font-feature-settings: 'tnum' 1, 'cv11' 1;
}
#app { position: fixed; inset: 0; overflow: hidden; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus { outline: none; }
:focus-visible { outline: .125rem solid var(--amber); outline-offset: .125rem; border-radius: .25rem; }
h1, h2, h3, h4, p { margin: 0; }
svg.ic { width: 1.25em; height: 1.25em; flex: none; vertical-align: -.2em; overflow: visible; }
::-webkit-scrollbar { width: .5rem; height: .5rem; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .14); border-radius: .5rem; border: .125rem solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- type scale ---------- */
.t-xs { font-size: .6875rem; } .t-sm { font-size: .8125rem; } .t-md { font-size: 1.0625rem; } .t-lg { font-size: 1.25rem; }
.t-xl { font-size: 1.625rem; } .t-2xl { font-size: 2.25rem; } .t-3xl { font-size: 3.25rem; }
.disp { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; line-height: 1; }
.lbl { font-size: .6875rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.num { font-variant-numeric: tabular-nums; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); } .info { color: var(--info); } .amber { color: var(--amber); }
.row { display: flex; align-items: center; gap: .5rem; } .col { display: flex; flex-direction: column; gap: .5rem; }
.grow { flex: 1 1 auto; min-width: 0; } .gap1 { gap: .25rem; } .gap3 { gap: .75rem; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- glass panel ---------- */
.panel {
  background: linear-gradient(180deg, var(--glass-a), var(--glass-b));
  border: 1px solid var(--stroke); border-radius: var(--r); box-shadow: var(--shadow), inset 0 1px 0 var(--hi);
  -webkit-backdrop-filter: blur(.9rem) saturate(1.3); backdrop-filter: blur(.9rem) saturate(1.3);
}
.panel-h { display: flex; align-items: center; gap: .625rem; padding: .75rem 1rem; border-bottom: 1px solid var(--stroke); }
.panel-h h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; letter-spacing: .06em; text-transform: uppercase; }
.panel-h .ic { color: var(--amber); width: 1.25rem; height: 1.25rem; }
.panel-b { padding: 1rem; }
.sep { height: 1px; background: var(--stroke); margin: .5rem 0; }
.card-in { animation: rise .28s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(.5rem); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes glow { 0%, 100% { filter: drop-shadow(0 0 0 var(--c, var(--bad))); } 50% { filter: drop-shadow(0 0 .5rem var(--c, var(--bad))); } }
:root[data-reduce-motion="1"] *, :root[data-reduce-motion="1"] *::before, :root[data-reduce-motion="1"] *::after { animation: none !important; transition: none !important; }

/* ---------- buttons, chips, keys ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem; height: 2.25rem; padding: 0 1rem; border-radius: var(--r-s);
  background: rgba(255, 255, 255, .06); border: 1px solid var(--stroke); font-weight: 600; font-size: .8125rem; letter-spacing: .02em; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .08s, color .15s;
}
.btn:hover { background: rgba(255, 255, 255, .11); border-color: var(--stroke2); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.primary { background: linear-gradient(180deg, #ffc668, #e79d2e); color: #25190a; border-color: rgba(255, 220, 160, .6); box-shadow: 0 .25rem 1rem rgba(246, 180, 79, .22); }
.btn.primary:hover { background: linear-gradient(180deg, #ffd28a, #f0a93d); }
.btn.danger { background: rgba(255, 93, 108, .14); border-color: rgba(255, 93, 108, .4); color: #ffc2c8; }
.btn.danger:hover { background: rgba(255, 93, 108, .24); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: rgba(255, 255, 255, .07); }
.btn.sq { width: 2.25rem; padding: 0; }
.btn.sm { height: 1.875rem; padding: 0 .75rem; font-size: .75rem; }
.btn.on { background: rgba(246, 180, 79, .16); border-color: rgba(246, 180, 79, .55); color: var(--amber2); }
.chip {
  --c: #fff; position: relative; display: inline-flex; align-items: center; gap: .375rem; height: 1.5rem; padding: 0 .625rem; border-radius: 99rem; font-size: .75rem; font-weight: 600;
  color: var(--c); isolation: isolate;
}
.chip::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--c); opacity: .14; z-index: -1; }
.chip::after { content: ''; position: absolute; inset: 0; border-radius: inherit; border: 1px solid var(--c); opacity: .32; z-index: -1; }
.chip .ic { width: .95em; height: .95em; }
kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 1.35rem; height: 1.35rem; padding: 0 .3rem; font: 600 .6875rem var(--font-ui);
  background: rgba(255, 255, 255, .08); border: 1px solid var(--stroke2); border-bottom-width: 2px; border-radius: .3rem; color: var(--text);
}
:root[data-hints="0"] kbd.hint { display: none; }

/* ---------- bars ---------- */
.bar { --c: var(--good); position: relative; height: .375rem; border-radius: 99rem; background: rgba(255, 255, 255, .09); overflow: hidden; }
.bar > i { position: relative; display: block; height: 100%; width: 0; border-radius: inherit; background: var(--c); transition: width .45s var(--ease); }
.bar > i::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, rgba(0, 0, 0, .38), rgba(255, 255, 255, .12)); }
.bar.thick { height: .625rem; } .bar.thin { height: .25rem; }
.bar.warn > i { animation: pulse 1.2s infinite; }

/* ---------- segmented control / toggle / tabs ---------- */
.seg { display: inline-flex; padding: .1875rem; gap: .125rem; background: rgba(0, 0, 0, .3); border: 1px solid var(--stroke); border-radius: .625rem; }
.seg button { display: inline-flex; align-items: center; justify-content: center; gap: .375rem; height: 1.875rem; min-width: 1.875rem; padding: 0 .75rem; border: 0; background: transparent; border-radius: .45rem; color: var(--muted); font-weight: 600; font-size: .75rem; transition: background .15s, color .15s; }
.seg button:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
.seg button.on { background: rgba(246, 180, 79, .18); color: var(--amber2); box-shadow: inset 0 0 0 1px rgba(246, 180, 79, .4); }
.tgl { position: relative; width: 2.5rem; height: 1.375rem; border-radius: 99rem; border: 1px solid var(--stroke2); background: rgba(255, 255, 255, .08); padding: 0; transition: background .2s; }
.tgl i { position: absolute; top: .125rem; left: .125rem; width: 1rem; height: 1rem; border-radius: 50%; background: #cfd8e8; transition: transform .2s var(--ease), background .2s; }
.tgl.on { background: rgba(246, 180, 79, .35); border-color: rgba(246, 180, 79, .6); }
.tgl.on i { transform: translateX(1.125rem); background: var(--amber2); }
input[type=range] { -webkit-appearance: none; appearance: none; height: .375rem; border-radius: 99rem; background: rgba(255, 255, 255, .14); width: 100%; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 1rem; height: 1rem; border-radius: 50%; background: var(--amber2); border: .125rem solid #3a2610; box-shadow: 0 0 .5rem rgba(246, 180, 79, .5); }
input[type=text], input[type=number], select { height: 2.25rem; padding: 0 .75rem; border-radius: var(--r-s); border: 1px solid var(--stroke2); background: rgba(0, 0, 0, .35); color: var(--text); font: inherit; font-size: .8125rem; user-select: text; }

/* ---------- tooltip + context menu ---------- */
#tip, #ctx { position: fixed; left: 0; top: 0; z-index: 90; }
#tip { pointer-events: none; max-width: 24rem; padding: .625rem .8rem; border-radius: .6rem; background: rgba(8, 11, 18, .96); border: 1px solid var(--stroke2); box-shadow: var(--shadow); font-size: .8125rem; line-height: 1.45; }
#tip b { color: var(--amber2); font-weight: 600; }
#tip .tt-h { font-family: var(--font-display); font-size: 1.125rem; font-weight: 600; letter-spacing: .03em; margin-bottom: .25rem; }
#tip .tt-r { display: flex; justify-content: space-between; gap: 1.5rem; color: var(--muted); }
#tip .tt-r span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
#ctx { min-width: 12rem; padding: .3rem; border-radius: .7rem; background: rgba(10, 14, 22, .97); border: 1px solid var(--stroke2); box-shadow: var(--shadow); }
.ctx-i { display: flex; width: 100%; align-items: center; gap: .6rem; height: 2rem; padding: 0 .65rem; border: 0; border-radius: .45rem; background: transparent; text-align: left; font-size: .8125rem; }
.ctx-i span { flex: 1; }
.ctx-i:hover, .ctx-i:focus-visible { background: rgba(255, 255, 255, .09); }
.ctx-i[disabled] { opacity: .4; pointer-events: none; }
.ctx-i .ic { color: var(--amber); }
#ctx .sep { margin: .25rem 0; }

#vignette { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s; z-index: 1;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(255, 40, 60, .0) 70%, rgba(255, 40, 60, .38) 100%); }
#vignette.on { opacity: 1; animation: pulse 1.8s infinite; }
#vignette.low { background: radial-gradient(ellipse at center, transparent 50%, rgba(120, 0, 10, .55) 100%); }
#preview-badge { position: absolute; left: 50%; bottom: .3rem; transform: translateX(-50%); z-index: 70; padding: .2rem .8rem; border-radius: 99rem; font-size: .6875rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  background: rgba(10, 14, 22, .72); border: 1px solid rgba(246, 180, 79, .4); color: var(--amber2); pointer-events: none; }
</style>
<style>
/* Survival HUD: vitals (bottom-left), compass (top-centre), clock + weather (top-right), threat alert (right), key hints (bottom-centre). */
#hud { position: absolute; inset: 0; pointer-events: none; opacity: var(--hud-opacity); z-index: 5; transition: opacity .3s; }
:root[data-mode="colony"] #hud { display: none; }
:root[data-screen]:not([data-screen=""]) #hud .hints { display: none; }
/* the inventory panel covers the vitals corner: fade them out instead of leaving half a gauge showing */
:root[data-screen="inventory"] #hud .vitals { opacity: 0; transform: translateX(-1rem); animation: none; transition: opacity .2s, transform .2s; }

/* ----- vitals ----- */
#hud .vitals { position: absolute; left: 1.75rem; bottom: 1.75rem; width: 21rem; padding: 1rem 1.125rem 1rem; display: flex; flex-direction: column; gap: .875rem; animation: rise .5s var(--ease) both; }
.hp-row { display: grid; grid-template-columns: 2.5rem 1fr; gap: .75rem; align-items: center; }
.hp-ico { width: 2.5rem; height: 2.5rem; border-radius: .7rem; display: grid; place-items: center; color: var(--hp); background: rgba(255, 93, 108, .12); box-shadow: inset 0 0 0 1px rgba(255, 93, 108, .32); }
.hp-ico .ic { width: 1.4rem; height: 1.4rem; }
.hp-ico.crit { animation: pulse .9s infinite; }
.hp-top { display: flex; align-items: baseline; gap: .4rem; margin-bottom: .35rem; }
.hp-top .disp { font-size: 2rem; line-height: .9; letter-spacing: 0; }
.hp-top .of { color: var(--dim); font-size: .8125rem; }
.hp-top .lbl { margin-left: auto; }
#hud .vitals .bar { --c: var(--hp); height: .5rem; }
.gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.gauge { position: relative; display: flex; flex-direction: column; align-items: center; gap: .25rem; }
.gauge svg.ring { width: 3.75rem; height: 3.75rem; transform: rotate(-90deg); overflow: visible; }
.gauge circle { fill: none; stroke-width: 3.6; stroke-linecap: round; }
.gauge .trk { stroke: rgba(255, 255, 255, .09); }
.gauge .val { stroke: var(--c); stroke-dasharray: 113.1; stroke-dashoffset: 113.1; transition: stroke-dashoffset .6s var(--ease), stroke .3s; filter: drop-shadow(0 0 .25rem var(--c)); }
.gauge .gi { position: absolute; top: 1.2rem; left: 50%; transform: translateX(-50%); color: var(--c); display: grid; place-items: center; }
.gauge .gi .ic { width: 1.35rem; height: 1.35rem; }
.gauge .gv { font-family: var(--font-display); font-weight: 600; font-size: 1.125rem; line-height: 1; }
.gauge .gl { font-size: .625rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: -.1rem; }
.gauge.low .val { stroke: var(--warn); } .gauge.low .gi { color: var(--warn); }
.gauge.crit .val { stroke: var(--bad); animation: pulse .9s infinite; } .gauge.crit .gi { color: var(--bad); }
.status-row { display: flex; flex-wrap: wrap; gap: .4rem; }
.wt { display: grid; grid-template-columns: 1.25rem 1fr auto; gap: .6rem; align-items: center; font-size: .75rem; color: var(--muted); }
.wt .bar { --c: var(--weight); height: .3125rem; }
.wt.heavy .bar { --c: var(--warn); } .wt.over .bar { --c: var(--bad); }
.wt .num { color: var(--text); font-weight: 600; }

/* ----- compass ----- */
#hud .compass { position: absolute; top: 1.25rem; left: 50%; transform: translateX(-50%); width: 30rem; height: 3rem; padding: 0; overflow: hidden; border-radius: 99rem; animation: rise .5s var(--ease) both; }
#hud .compass canvas { width: 100%; height: 100%; display: block; }
#hud .compass .deg { position: absolute; left: 50%; top: -.05rem; transform: translateX(-50%); font: 700 .6875rem var(--font-ui); color: var(--amber2); letter-spacing: .08em; }

/* ----- clock ----- */
#hud .clock { position: absolute; top: 1.25rem; right: 1.75rem; min-width: 15rem; padding: .75rem 1.125rem; display: grid; grid-template-columns: auto 1fr; gap: .25rem .875rem; align-items: center; animation: rise .5s var(--ease) both; }
.clock .sun { grid-row: 1 / 3; width: 2.75rem; height: 2.75rem; border-radius: 50%; display: grid; place-items: center; color: var(--amber2); background: rgba(246, 180, 79, .12); box-shadow: inset 0 0 0 1px rgba(246, 180, 79, .3); }
.clock .sun.night { color: #b9c6ff; background: rgba(120, 140, 255, .12); box-shadow: inset 0 0 0 1px rgba(150, 165, 255, .3); }
.clock .sun .ic { width: 1.5rem; height: 1.5rem; }
.clock .time { font-family: var(--font-display); font-weight: 600; font-size: 2.25rem; line-height: .95; letter-spacing: .02em; }
.clock .meta { display: flex; align-items: center; gap: .6rem; font-size: .6875rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.clock .meta .ic { width: 1rem; height: 1rem; }
.clock .meta .off { color: var(--bad); }
.clock .meta .ok { color: var(--good); }

/* ----- colony chip (top-left) ----- */
#hud .colony-chip { position: absolute; top: 1.25rem; left: 1.75rem; display: flex; align-items: center; gap: .75rem; padding: .5rem 1rem .5rem .75rem; animation: rise .5s var(--ease) both; }
.colony-chip .ic { color: var(--amber); width: 1.4rem; height: 1.4rem; }
.colony-chip .big { font-family: var(--font-display); font-weight: 600; font-size: 1.375rem; line-height: 1; }
.colony-chip small { display: block; font-size: .625rem; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* ----- threat ----- */
#hud .threat { position: absolute; top: 7.25rem; right: 1.75rem; width: 15rem; padding: .875rem 1rem; display: flex; flex-direction: column; gap: .6rem; transition: opacity .4s, transform .4s var(--ease); }
#hud .threat.idle { opacity: 0; transform: translateX(1rem); }
#hud .threat .th-h { display: flex; align-items: center; gap: .5rem; }
#hud .threat .th-h .ic { color: var(--c, var(--warn)); width: 1.25rem; height: 1.25rem; }
#hud .threat .lvl { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: .06em; text-transform: uppercase; color: var(--c, var(--warn)); line-height: 1; margin-left: auto; }
.segbar { display: grid; grid-template-columns: repeat(10, 1fr); gap: .1875rem; }
.segbar i { height: .5rem; border-radius: .15rem; background: rgba(255, 255, 255, .09); transition: background .3s; }
.segbar i.on { background: var(--c, var(--warn)); box-shadow: 0 0 .5rem var(--c, var(--warn)); }
#hud .threat .near { display: flex; align-items: center; gap: .6rem; font-size: .8125rem; }
#hud .threat .near .arrow { width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .07); color: var(--c, var(--warn)); }
#hud .threat .near .arrow svg { width: 1rem; height: 1rem; transition: transform .3s; }
#hud .threat.t-low { --c: var(--info); } #hud .threat.t-elevated { --c: var(--warn); } #hud .threat.t-high { --c: #ff7a3d; } #hud .threat.t-critical { --c: var(--bad); animation: glow 1.4s infinite; }

/* ----- hints ----- */
#hud .hints { position: absolute; left: 50%; bottom: 2.2rem; transform: translateX(-50%); display: flex; gap: 1.25rem; padding: .5rem 1rem; font-size: .75rem; color: var(--muted); border-radius: 99rem; }
#hud .hints span { display: inline-flex; align-items: center; gap: .4rem; }
</style>
<style>
/* Colony mode chrome: top bar, roster, dock, command bar, minimap. Layout is in rem so it scales 1080p -> 4K. */
#colony { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
#colony > * { pointer-events: auto; }
#mapbg { position: absolute; inset: 0; z-index: 0; }
#mapbg.layer { background: transparent; }
#mapbg .selbox { position: fixed; z-index: 3; pointer-events: none; border: 1px solid var(--amber); background: rgba(246, 180, 79, .16); border-radius: 2px; }
#mapbg .map-cv { position: absolute; inset: 0; display: block; }

html[data-ui="touch"] .mtool > .ic, html[data-ui="touch"] .mtool h2 { display: none; }
html[data-ui="touch"] .mtool .layers { order: 5; flex: 1 0 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; }
html[data-ui="touch"] .mtool .layers::-webkit-scrollbar { display: none; }
html[data-ui="touch"] .mtool .layers { padding: 4px; margin: -4px; }
html[data-ui="touch"] .mtool .layers .chip { flex: none; }
html[data-ui="touch"] .mtool .grow { order: 2; }
html[data-ui="touch"] .mtool > .row { order: 1; }
html[data-ui="touch"] .mtool > .btn.sq { order: 3; }
html[data-ui="touch"] .mside { display: none; }
html[data-ui="touch"] .mlegend { left: var(--pad-l); right: var(--pad-r); bottom: calc(var(--sab) + 6px); gap: .25rem .75rem; padding: .4rem .75rem; font-size: max(11px, .75rem); }
html[data-ui="touch"] .mlegend span:has(kbd) { display: none; }

/* ---------- survival HUD: no horizontal overflow on a phone ---------- */
html[data-ui="touch"] #hud .vitals { left: var(--pad-l); bottom: calc(var(--sab) + 8px); width: min(21rem, calc(100vw - 16px)); }
html[data-ui="touch"] #hud .compass { top: calc(var(--sat) + 6px); width: min(26rem, calc(100vw - 16px)); }
html[data-ui="touch"] #hud .clock { top: calc(var(--sat) + 62px); right: var(--pad-r); min-width: 0; padding: .5rem .75rem; }
html[data-ui="touch"] #hud .colony-chip { display: none; }
html[data-ui="touch"] #hud .threat { top: calc(var(--sat) + 150px); right: var(--pad-r); width: min(15rem, 52vw); }
html[data-ui="touch"] #hud .hints { display: none; }

/* ======================================================================================================================== landscape */
@media (orientation: landscape) {
  html[data-ui="touch"] #colony { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr) auto; }
  html[data-ui="touch"] #topbar { grid-column: 1 / -1; grid-row: 1; display: flex; flex-direction: row; gap: 8px; padding: calc(var(--sat) + 4px) var(--pad-r) 4px var(--pad-l); border-radius: 0 0 16px 16px; }
  html[data-ui="touch"] #topbar .timebox { order: 1; flex: none; padding-right: 20px; }
  html[data-ui="touch"] #topbar .seg.speed { order: 2; flex: none; width: 236px; }
  html[data-ui="touch"] #topbar .resources { order: 3; flex: 1 1 0; min-width: 0; }
  html[data-ui="touch"] #topbar > .btn.sq { order: 4; flex: none; }
  html[data-ui="touch"] #roster { grid-column: 1; grid-row: 2 / 4; margin: 0; padding: 0 0 0 var(--sal); width: auto; display: flex; flex-direction: column; min-height: 0; }
  html[data-ui="touch"] .rlist { flex-direction: column; overflow-x: hidden; overflow-y: auto; padding: 6px 6px 6px 6px; gap: 6px; touch-action: pan-y; }
  html[data-ui="touch"] .crow, html[data-ui="touch"] .rlist.dense .crow { width: 60px; height: auto; min-height: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; }
  html[data-ui="touch"] .crow .rbody { width: 100%; }
  html[data-ui="touch"] .crow .rtop, html[data-ui="touch"] .crow .rj { display: none; }
  html[data-ui="touch"] .crow .rbars { grid-template-columns: 1fr; gap: 3px; margin: 0; }
  html[data-ui="touch"] #cmdbar, html[data-ui="touch"] #placebar { grid-column: 2; grid-row: 3; align-self: end; justify-self: center; max-width: 100%; margin: 0 8px 8px; }
  html[data-ui="touch"] #placebar { width: min(560px, 100%); }
  html[data-ui="touch"] #mapctl { right: calc(var(--sar) + 88px); top: calc(var(--top-h) + 8px); }
  html[data-ui="touch"] #dock { grid-column: 3; grid-row: 2 / 4; flex-direction: row-reverse; border-radius: 20px 0 0 20px; border-width: 0 0 0 1px; min-height: 0; }
  html[data-ui="touch"] #dock .dtabs { flex-direction: column; width: calc(76px + var(--sar)); padding: 4px calc(var(--sar) + 4px) 4px 4px; overflow-y: auto; scrollbar-width: none; gap: 4px; }
  html[data-ui="touch"] .dtab { flex: none; min-height: 52px; }
  html[data-ui="touch"][data-sheet="open"] #dock .dbody, html[data-ui="touch"][data-sheet="full"] #dock .dbody { height: auto; width: var(--drawer-w); flex: none; }
  html[data-ui="touch"][data-sheet="full"] #dock { flex: none; }
  html[data-ui="touch"][data-sheet="full"] #dock .dbody { width: min(68vw, 600px); }
  html[data-ui="touch"] #dock .grip { display: none !important; }
  html[data-ui="touch"]:not([data-sheet="closed"]) #cmdbar { display: flex; }
  html[data-ui="touch"] #cmdbar .cmd.sel-all { display: flex; }
  html[data-ui="touch"][data-bar="place"] #cmdbar, html[data-ui="touch"][data-bar="order"] #cmdbar { display: none; }
  html[data-ui="touch"][data-sheet="open"] #mapctl, html[data-ui="touch"][data-sheet="full"] #mapctl { right: calc(var(--sar) + 88px + var(--drawer-w)); }
  html[data-ui="touch"] .toast { padding: .5rem .75rem; }
  html[data-ui="touch"] #toasts { left: calc(var(--sal) + 80px); right: calc(var(--sar) + 80px); }
  html[data-ui="touch"] #preview-badge { display: none; }
  /* screens: two columns where there is width */
  html[data-ui="touch"] .ibody { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  html[data-ui="touch"] .screen.inventory .panel-h input { flex: 1 1 12rem; order: 0; }
  html[data-ui="touch"] .mbody { grid-template-columns: 10rem minmax(0, 1fr); grid-template-rows: none; }
  html[data-ui="touch"] .mnav { flex-direction: column; border-bottom: 0; border-right: 1px solid var(--stroke); overflow-y: auto; }
  html[data-ui="touch"] .sgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  html[data-ui="touch"] .scharts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  html[data-ui="touch"] .mtool .layers { order: 0; flex: 1 1 0; min-width: 0; }
  html[data-ui="touch"] .mtool { flex-wrap: nowrap; }
  html[data-ui="touch"] #hud .vitals { transform-origin: bottom left; }
  html[data-ui="touch"] #hud .clock { top: calc(var(--sat) + 8px); }
  html[data-ui="touch"] #hud .threat { top: calc(var(--sat) + 90px); }
  html[data-ui="touch"] #hud .compass { display: none; }
}
@media (orientation: landscape) and (max-height: 540px) {
  html[data-ui="touch"] #hud .gauges { display: none; }
  html[data-ui="touch"] .sbig { font-size: 2.75rem; }
  html[data-ui="touch"] .screen .panel-h { min-height: 48px; padding: .25rem .75rem; }
}
</style>
