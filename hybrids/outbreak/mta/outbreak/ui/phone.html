      head.append(av, h('div.grow', h('div.cname.disp', OB.short(c.name) + ' “' + OB.nick(c.name) + '”'), h('div.muted.t-sm', 'Age ' + c.age + ' · joined day ' + c.joined_day + ' · ' + c.kills + ' kills'), h('div.cjob', OB.icon(OB.jobIcon(c.state === 'away' ? 'away' : c.downed ? 'downed' : c.job)), c.job_label)),
        h('div.col.gap1', h('button.btn.sm' + (c.drafted ? '.on' : ''), { on: { click: () => OB.order(c.id, 'draft', !c.drafted) } }, OB.icon('swords'), c.drafted ? 'Drafted' : 'Draft'), h('button.btn.sm', { on: { click: () => colony.focus(c.id) } }, OB.icon('crosshair'), 'Centre')));
      if (S.sel.length > 1) body.append(h('div.multi', OB.icon('people'), h('span', S.sel.length + ' selected'), h('span.muted.t-sm', 'commands apply to all')));
      body.append(({ needs: needsView, mood: moodView, skills: skillsView, gear: gearView, health: healthView })[tab](c));
    }
    return { el: root, update, onShow() { lastKey = ''; } };
  };
  OB.itemTip = function (id, n) {
    const d = OB.item(id);
    let rows = '<div class="tt-h">' + d.name + (n > 1 ? ' <span class="muted">x' + n + '</span>' : '') + '</div><div class="tt-r"><span>Category</span><span>' + F.cap(d.cat) + '</span></div><div class="tt-r"><span>Weight</span><span>' + F.kg(d.w) + (n > 1 ? ' (' + F.kg(d.w * n) + ')' : '') + '</span></div><div class="tt-r"><span>Value</span><span>' + d.value + '</span></div>';
    if (d.food) rows += '<div class="tt-r"><span>Restores</span><span>' + [d.food.hunger ? d.food.hunger + ' food' : '', d.food.thirst ? d.food.thirst + ' water' : ''].filter(Boolean).join(', ') + '</span></div>';
    if (d.med) rows += '<div class="tt-r"><span>Medical</span><span>' + F.cap(d.med.kind) + '</span></div>';
    if (d.weapon) rows += '<div class="tt-r"><span>' + F.cap(d.weapon.kind) + ' power</span><span>' + d.weapon.power + (d.weapon.ammo ? ' · uses ' + OB.item(d.weapon.ammo).name : '') + '</span></div><div class="tt-r"><span>Noise</span><span>' + d.weapon.noise + '</span></div>';
    if (d.fuel_l) rows += '<div class="tt-r"><span>Fuel</span><span>' + d.fuel_l + ' L</span></div>';
    return rows;
  };

  // ------------------------------------------------------------------------------------------------------------ command bar
  function buildCmdbar() {
    const bar = OB.$('#cmdbar');
    OB.clear(bar);
    bar.className = 'panel';
    const btn = (icon, label, key, run, extra) => {
      const b = h('button.cmd', { dataset: extra || {}, on: { click: run } }, OB.icon(icon), h('span', label), key ? h('kbd.hint', key) : null);
      OB.tip(b, label + (key ? ' <kbd>' + key + '</kbd>' : ''));
      return b;
    };
    el.cmdDraft = btn('swords', 'Draft', 'R', () => colony.toggleDraft());
    bar.append(
      btn('cursor', 'Select all', 'Ctrl+A', () => OB.select(S.state.colonists.map(c => c.id))),
      el.cmdDraft,
      h('i.vsep'),
      btn('bars', 'Priorities', 'P', () => OB.screens.toggle('priorities')),
      btn('hammer', 'Build', 'B', () => colony.setDock('build'), { dock: 'build' }),
      btn('zone', 'Stock', 'Z', () => colony.setDock('zones'), { dock: 'zones' }),
      btn('truck', 'Expeditions', '', () => colony.setDock('exped'), { dock: 'exped' }),
      btn('radar', 'Director', 'L', () => colony.setDock('director'), { dock: 'director' }),
      h('i.vsep'),
      btn('map', 'Map', 'M', () => OB.screens.toggle('map')),
      btn('crate', 'Inventory', 'I', () => OB.screens.toggle('inventory')),
    );
  }
  colony.toggleDraft = function () {
    if (!S.state) return;
    const ids = S.sel.length ? S.sel : S.state.colonists.map(c => c.id);
    const any = ids.some(id => { const c = OB.col(id); return c && !c.drafted; });
    if (!S.sel.length) OB.order('all', 'draft', any); else ids.forEach(id => OB.order(id, 'draft', any));
  };
  colony.focus = function (id) {
    const c = OB.col(id); if (!c) return;
    OB.post('focus', { x: c.x, y: c.y, id });
    if (OB.mapBg) OB.mapBg.center(c.x, c.y);
    OB.select([id]);
  };

  // ---------------------------------------------------------------------------------------------------------- minimap + world
  function buildMinimap() {
    const box = OB.$('#minimap');
    OB.clear(box);
    box.className = 'panel';
    const holder = h('div.mm-body');
    const zoom = h('div.mm-btns', h('button.btn.sq.sm.ghost', { 'aria-label': 'Open map', on: { click: () => OB.screens.open('map') } }, OB.icon('map')));
    box.append(holder, h('div.mm-n', 'N'), zoom, h('div.mm-l', 'Region'));
    OB.minimap = OB.map.reg(new OB.MapView(holder, { mode: 'mini', interactive: false }));
    OB.minimap.s = 0.058; OB.minimap.cx = 0; OB.minimap.cy = 0; OB.minimap.follow = false;
    OB.on('mapfocus', p => { if (OB.mapBg) OB.mapBg.center(p.x, p.y); });
  }
  function buildWorld() {
    const bg = OB.$('#mapbg');
    OB.clear(bg);
    if (OB.preview || (S.boot && S.boot.preview)) {
      bg.hidden = false;
      OB.mapBg = OB.map.reg(new OB.MapView(bg, { mode: 'full' }));
      OB.mapBg.fit(false);
      colony.worldMode = 'map';
    } else {
      // in game the 3D world shows through: forward pointer input to the Lua client (normalised 0..1 coordinates) for ray casts / box select
      bg.hidden = false;
      bg.classList.add('layer');
      const send = (type, e, extra) => OB.post('mouse', Object.assign({ type, x: e.clientX / innerWidth, y: e.clientY / innerHeight, button: e.button, shift: e.shiftKey, ctrl: e.ctrlKey, alt: e.altKey }, extra || {}));
      const mv = OB.throttle(e => send('move', e), 33);
      // the selection rectangle is drawn here (the Lua side only needs the end points); it shows once the drag is a few pixels long
      const box = h('div.selbox'); box.hidden = true; bg.append(box);
      let drag = null;
      const showBox = e => {
        const x0 = Math.min(drag.x, e.clientX), y0 = Math.min(drag.y, e.clientY), w = Math.abs(e.clientX - drag.x), hh = Math.abs(e.clientY - drag.y);
        const on = w + hh > 8;
        if (on) { box.style.left = x0 + 'px'; box.style.top = y0 + 'px'; box.style.width = w + 'px'; box.style.height = hh + 'px'; }
        box.hidden = !on;
      };
      bg.addEventListener('pointerdown', e => { bg.setPointerCapture(e.pointerId); if (e.button === 0) drag = { x: e.clientX, y: e.clientY }; send('down', e); });
      bg.addEventListener('pointerup', e => { drag = null; box.hidden = true; send('up', e); });
      bg.addEventListener('pointercancel', () => { drag = null; box.hidden = true; });
      bg.addEventListener('pointermove', e => { if (drag && !OB.build.placing) showBox(e); mv(e); });
      bg.addEventListener('dblclick', e => send('dblclick', e));
      bg.addEventListener('wheel', e => { e.preventDefault(); send('wheel', e, { dy: Math.sign(e.deltaY) }); }, { passive: false });
      bg.addEventListener('contextmenu', e => { e.preventDefault(); send('context', e); });
      colony.worldMode = 'layer';
    }
  }

  // ---------------------------------------------------------------------------------------------------------- lifecycle
  colony.init = function () {
    buildTopbar(); buildRoster(); buildDock(); buildCmdbar(); buildMinimap();
    OB.on('boot', () => {});
    OB.on('selection', () => { if (S.state) { updateRoster(S.state); } });
  };
  colony.enter = function () {
    if (!OB.mapBg && !el.worldBuilt) { el.worldBuilt = true; buildWorld(); }
    if (S.state) { colony.update(S.state); OB.map.updateAll(S.state); }
  };
  colony.leave = function () { if (OB.build) OB.build.cancel(true); };
  colony.update = function (st) {
    updateTopbar(st);
    updateRoster(st);
    const p = colony.panels[S.dock];
    if (p) p.update(st);
    OB.toggle(el.cmdDraft, 'on', S.sel.length ? S.sel.every(id => { const c = OB.col(id); return c && c.drafted; }) : st.colonists.length > 0 && st.colonists.every(c => c.drafted));
  };
})();
</script>
<script>
/* Inventory screen: player grid + one other container (stockpile zone, ground pile, colonist, world container). Drag and drop (pointer events),
   shift/ctrl quick-move, context menu, search + category filter, weight/slot meters.
   borrowed: overextended/ox_inventory/web/src/components/inventory/{InventoryGrid,InventorySlot,InventoryControl,SlotTooltip}.tsx (GPL-3.0, private use; see THIRD_PARTY.md):
   layout and interaction patterns (no code copied verbatim): 5-6 column square-slot grid,
   header weight meter, count top-right / label box at the bottom of the slot, dashed drop target, drag preview following the cursor,
   tooltip after a short hover delay, context menu (use / drop / give amount), ctrl-click = move one, alt/dblclick = use. Re-implemented in
   vanilla JS against our own message contract. Hotbar, shops and crafting of ox_inventory are not used. */
(function () {
  'use strict';
  const OB = window.OB, h = OB.h, S = OB.S, F = OB.fmt;
  let root, grids = {}, srcList, search = '', catFilter = null, amount = 'stack', other = null, hdr = {};
  let drag = null;

  function usable(id) { const d = OB.item(id); return !!(d.food || (d.med && d.med.kind !== 'surgery')); }

  function slotEl(side, stack, idx) {
    const d = stack ? OB.item(stack.id) : null;
    const col = d ? OB.catColor[d.cat] || '#9aa7bd' : '';
    const s = h('div.slot' + (stack ? '.full' : ''), { dataset: { side, idx }, style: stack ? { '--c': col, '--hue': OB.hue(stack.id) } : {}, tabindex: stack ? 0 : -1, role: 'button',
      'aria-label': stack ? d.name + ' x' + stack.n : 'empty slot' });
    if (!stack) return s;
    s.append(h('div.sw.num', F.kg(stack.w)), h('div.sc.num', stack.n > 1 ? stack.n + '×' : ''), h('div.si', OB.icon(OB.itemIcon(stack.id))), h('div.sl', h('span.ell', d.name)));
    if (d.weapon && d.weapon.kind === 'ranged') s.append(h('i.sdot', { title: 'uses ' + OB.item(d.weapon.ammo).name }));
    OB.tip(s, () => OB.itemTip(stack.id, stack.n), 450);
    s.addEventListener('pointerdown', e => startDrag(e, side, idx, stack, s));
    s.addEventListener('contextmenu', e => { e.preventDefault(); slotMenu(e, side, stack); });
    s.addEventListener('dblclick', () => { if (side === 'player' && usable(stack.id)) OB.ui('use_item', { item: stack.id }); else quickMove(side, stack, stack.n); });
    s.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); if (side === 'player' && usable(stack.id)) OB.ui('use_item', { item: stack.id }); else quickMove(side, stack, stack.n); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const cells = Array.from(s.parentElement.children), i = cells.indexOf(s), cols = 6;
        const t = cells[i + ({ ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key])];
        if (t) t.focus();
      }
    });
    return s;
  }

  function loc(side) { return side === 'player' ? { kind: 'player' } : { kind: other.kind, id: other.id }; }
  function moveCount(stack, mode) { return mode === 'one' ? 1 : mode === 'half' ? Math.max(1, Math.floor(stack.n / 2)) : mode === 'stack' ? stack.n : Math.min(stack.n, +amount || stack.n); }
  function quickMove(side, stack, n) {
    if (!other) { if (side === 'player') OB.toast('info', 'Pick a container on the right first.'); return; }
    OB.ui('inventory_move', { from: loc(side), to: loc(side === 'player' ? 'other' : 'player'), item: stack.id, n });
  }
  function slotMenu(e, side, stack) {
    const d = OB.item(stack.id), items = [];
    if (side === 'player' && usable(stack.id)) items.push({ icon: d.food ? 'food' : 'cross', label: 'Use', key: 'Enter', run: () => OB.ui('use_item', { item: stack.id }) });
    items.push({ icon: 'chev', label: 'Move ' + (side === 'player' ? 'to ' + (other ? other.label : 'container') : 'to you') + ' (' + stack.n + ')', run: () => quickMove(side, stack, stack.n) });
    if (stack.n > 1) { items.push({ icon: 'chev', label: 'Move half (' + Math.floor(stack.n / 2) + ')', run: () => quickMove(side, stack, Math.floor(stack.n / 2)) }); items.push({ icon: 'chev', label: 'Move one', run: () => quickMove(side, stack, 1) }); }
    if (side === 'player') items.push('-', { icon: 'down', label: 'Drop on the ground', run: () => OB.ui('drop_item', { item: stack.id, n: stack.n }) });
    OB.ctx(e.clientX, e.clientY, items);
  }

  // ----------------------------------------------------------------------------------------------------------- drag and drop
  function startDrag(e, side, idx, stack, node) {
    if (e.button !== 0 || e.pointerType === 'touch') return;
    const sx = e.clientX, sy = e.clientY, ctrl = e.ctrlKey, shift = e.shiftKey;
    let started = false;
    const gh = OB.$('#dragghost');
    const onMove = ev => {
      if (!started) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
        started = true;
        drag = { side, stack, node };
        node.classList.add('dragging');
        OB.clear(gh); gh.append(OB.icon(OB.itemIcon(stack.id)), h('b', stack.n > 1 ? stack.n + '×' : '')); gh.style.setProperty('--c', OB.catColor[OB.item(stack.id).cat] || '#fff');
        gh.hidden = false; document.body.classList.add('dragging'); OB.hideTip();
      }
      gh.style.transform = 'translate(' + (ev.clientX + 8) + 'px,' + (ev.clientY + 8) + 'px)';
      const over = document.elementFromPoint(ev.clientX, ev.clientY);
      const zone = over && over.closest && over.closest('.igrid');
      for (const k of Object.keys(grids)) grids[k].classList.toggle('drop', !!zone && zone === grids[k] && grids[k].dataset.side !== side);
    };
    const onUp = ev => {
      document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp);
      if (!started) { if (ctrl) quickMove(side, stack, 1); else if (shift) quickMove(side, stack, stack.n); return; }
      gh.hidden = true; document.body.classList.remove('dragging'); node.classList.remove('dragging');
      for (const k of Object.keys(grids)) grids[k].classList.remove('drop');
      const over = document.elementFromPoint(ev.clientX, ev.clientY);
      const zone = over && over.closest && over.closest('.igrid');
      drag = null;
      if (!zone || zone.dataset.side === side) return;
      const n = ev.shiftKey ? Math.max(1, Math.floor(stack.n / 2)) : ev.ctrlKey ? 1 : moveCount(stack, amount === 'stack' ? 'stack' : 'amt');
      if (!other && side === 'player') { OB.toast('info', 'Pick a container on the right first.'); return; }
      OB.ui('inventory_move', { from: loc(side), to: loc(side === 'player' ? 'other' : 'player'), item: stack.id, n });
    };
    document.addEventListener('pointermove', onMove); document.addEventListener('pointerup', onUp);
  }

  // --------------------------------------------------------------------------------------------------------------- rendering
  function match(stack) {
    const d = OB.item(stack.id);
    if (catFilter && d.cat !== catFilter) return false;
    if (search && d.name.toLowerCase().indexOf(search) < 0) return false;
    return true;
  }
  function fillGrid(grid, side, c) {
    OB.clear(grid);
    const stacks = c ? c.stacks.filter(match) : [];
    const cap = Math.max(30, Math.ceil(stacks.length / 6) * 6, side === 'player' && c && c.slots ? Math.ceil(c.slots / 6) * 6 : 0);
    for (let i = 0; i < cap; i++) grid.append(slotEl(side, stacks[i], i));
  }
  function meter(box, c, label) {
    const w = c ? c.w : 0, cap = c && c.cap ? c.cap : 0;
    box.bar.set(cap ? w / cap * 100 : 0, cap && w / cap > 0.9 ? 'var(--bad)' : cap && w / cap > 0.7 ? 'var(--warn)' : 'var(--weight)');
    OB.setText(box.txt, F.kg(w) + (cap ? ' / ' + F.kg(cap) : '') + (c && c.slots ? ' · ' + c.used + '/' + c.slots + ' slots' : c ? ' · ' + c.used + ' stacks' : ''));
    if (label != null) OB.setText(box.title, label);
  }

  function render(d) {
    if (!root || !d) return;
    S.inv = d;
    other = d.other || null;
    fillGrid(grids.player, 'player', d.player);
    fillGrid(grids.other, 'other', d.other);
    meter(hdr.player, d.player, 'You');
    meter(hdr.other, d.other, d.other ? d.other.label : 'No container selected');
    OB.show(OB.$('.iempty', root), !d.other);
    // source chips
    OB.reconcile(srcList, d.nearby.slice(0, 40), s => s.kind + s.id, s => {
      const b = h('button.src', { on: { click: () => OB.ui('inventory', { other: { kind: s.kind, id: s.id } }) } }, OB.icon(s.kind === 'zone' ? 'zone' : s.kind === 'colonist' ? 'person' : s.kind === 'pile' ? 'crate' : 'cross2'), h('span.ell', ''));
      b.lab = b.lastChild; return b;
    }, (b, s) => { OB.setText(b.lab, s.label); OB.toggle(b, 'on', !!d.other && d.other.kind === s.kind && d.other.id === s.id); b.title = s.kind + (s.dist ? ' · ' + F.dist(s.dist) : ''); });
  }

  function build() {
    grids.player = h('div.igrid', { dataset: { side: 'player' } });
    grids.other = h('div.igrid', { dataset: { side: 'other' } });
    for (const k of ['player', 'other']) hdr[k] = { bar: OB.bar('thick'), txt: h('span.num.muted.t-sm', ''), title: h('h3.disp', '') };
    srcList = h('div.srclist');
    const searchEl = h('input', { type: 'text', placeholder: 'Search items', 'aria-label': 'Search items', on: { input: e => { search = e.target.value.trim().toLowerCase(); if (S.inv) render(S.inv); } } });
    const cats = h('div.catchips');
    for (const c of (S.catalog ? S.catalog.item_cats : ['food', 'drink', 'medical', 'weapon', 'ammo', 'material', 'fuel', 'tool'])) {
      cats.append(h('button.chip.tab', { style: { '--c': OB.catColor[c] }, dataset: { cat: c }, 'aria-pressed': 'false', on: { click: e => { catFilter = catFilter === c ? null : c; OB.$$('.tab', cats).forEach(x => { const on = x.dataset.cat === catFilter; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on ? 'true' : 'false'); }); if (S.inv) render(S.inv); } } }, OB.icon(OB.catIcon(c)), F.cap(c)));
    }
    const amt = OB.seg([{ value: 'stack', label: 'Stack' }, { value: '1', label: '1' }, { value: '5', label: '5' }, { value: '10', label: '10' }], 'stack', v => (amount = v));
    const left = h('section.icol', h('div.ih', hdr.player.title, h('span.grow'), hdr.player.txt), hdr.player.bar, grids.player);
    const right = h('section.icol', h('div.ih', hdr.other.title, h('span.grow'), hdr.other.txt), hdr.other.bar, srcList, h('div.gridwrap', grids.other, h('div.iempty', OB.icon('crate'), h('b', 'Pick a container'), h('span.muted', 'Stockpile zones, ground piles and colonists within reach are listed above.'))));
    const mid = h('div.imid', h('div.lbl', 'Move'), amt, h('div.hintlist', h('span', OB.key('Drag'), 'move a stack'), h('span', OB.key('Shift'), 'half / quick'), h('span', OB.key('Ctrl'), 'one'), h('span', OB.key('Dbl-click'), 'use')));
    root = h('div.panel.screen.inventory', h('div.panel-h', OB.icon('crate'), h('h2', 'Inventory'), h('div.grow'), searchEl, h('button.btn.sq.ghost', { 'aria-label': 'Close', on: { click: () => OB.screens.close() } }, OB.icon('x'))),
      h('div.itoolbar', cats), h('div.ibody', left, mid, right));
    OB.on('inventory', render);
    return root;
  }

  OB.screens.reg('inventory', {
    build,
    onOpen(arg) { OB.ui('inventory', { other: arg && arg.other ? arg.other : (S.inv && S.inv.other ? { kind: S.inv.other.kind, id: S.inv.other.id } : null) }); },
    onClose() { drag = null; const gh = OB.$('#dragghost'); if (gh) gh.hidden = true; document.body.classList.remove('dragging'); },
    update() { /* inventory data arrives through the `inventory` message, not the colony state */ },
  });
})();
</script>
<script>
/* Work priorities grid: colonists x work types. Click cycles 0-4 (1 = highest, 0 = never), right-click goes back, digits set directly,
   arrow keys move. Every change is an `order priority {work, level}`; the cell updates optimistically and is reconciled by the next state. */
(function () {
  'use strict';
  const OB = window.OB, h = OB.h, S = OB.S, F = OB.fmt;
  const WORK = ['doctor', 'guard', 'build', 'cook', 'craft', 'haul', 'scavenge'];
  const SKILL = { doctor: 'medicine', guard: 'shooting', build: 'construction', cook: 'cooking', craft: 'construction', haul: null, scavenge: 'scavenging' };
  const NAME = { doctor: 'Doctor', guard: 'Guard', build: 'Build', cook: 'Cook', craft: 'Craft', haul: 'Haul', scavenge: 'Scavenge' };
  const HELP = { doctor: 'Treats wounds and infections', guard: 'Mans watchtowers and defends the base', build: 'Builds blueprints, repairs walls', cook: 'Cooks meals at stoves and fires', craft: 'Works at workbenches', haul: 'Carries items to stockpiles and building sites', scavenge: 'Volunteers for expeditions' };
  let root, table, body, head, foot, focusKey = '';

  function setLevel(id, work, level, cell) {
    const c = OB.col(id); if (!c || c.blocked[work]) return;
    level = ((level % 5) + 5) % 5;
    c.prio[work] = level;
    if (cell) paint(cell, c, work);
    OB.order(id, 'priority', { work, level });
  }
  function paint(cell, c, work) {
    const lv = c.prio[work], blocked = !!c.blocked[work];
    const sk = SKILL[work] ? c.skill[SKILL[work]] : null;
    OB.setAttr(cell, 'data-lv', blocked ? 'x' : lv);
    OB.setText(cell.lv, blocked ? '' : lv ? lv : '·');
    OB.show(cell.lock, blocked);
    OB.setText(cell.sk, sk != null ? 'L' + sk : '');
    OB.setAttr(cell, 'aria-label', c.name + ', ' + NAME[work] + ', ' + (blocked ? 'blocked' : lv ? 'priority ' + lv : 'never'));
    cell.disabled = blocked;
  }

  function makeRow(c) {
    const cells = {};
    const rowEl = h('div.prow', { role: 'row', dataset: { id: c.id } });
    const who = h('button.pwho', { on: { click: () => OB.select([c.id]) } }, h('span.av.sm', h('span', '')), h('span.pn.ell', ''), h('span.pm.num', ''));
    rowEl.append(who);
    WORK.forEach((w, wi) => {
      const lv = h('b', ''), sk = h('i.psk', ''), lock = OB.icon('lock'); lock.hidden = true;
      const cell = h('button.pcell', { role: 'gridcell', tabindex: -1, dataset: { work: w, id: c.id, col: wi }, on: {
        click: () => { const cc = OB.col(c.id); if (cc) setLevel(c.id, w, cc.prio[w] + 1, cell); },
        contextmenu: e => { e.preventDefault(); const cc = OB.col(c.id); if (cc) setLevel(c.id, w, cc.prio[w] - 1, cell); },
        focus: () => { focusKey = c.id + '|' + w; },
        keydown: e => {
          const cc = OB.col(c.id); if (!cc) return;
          if (/^[0-4]$/.test(e.key)) { e.preventDefault(); setLevel(c.id, w, +e.key, cell); }
          else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setLevel(c.id, w, cc.prio[w] + 1, cell); }
          else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); setLevel(c.id, w, 0, cell); }
          else if (e.key.startsWith('Arrow')) { e.preventDefault(); move(rowEl, wi, e.key); }
        },
      } }, lv, sk, lock);
      cell.lv = lv; cell.sk = sk; cell.lock = lock; cells[w] = cell; rowEl.append(cell);
    });
    rowEl.cells = cells; rowEl.who = who;
    return rowEl;
  }
  function move(rowEl, wi, key) {
    let r = rowEl, i = wi;
    if (key === 'ArrowLeft') i = Math.max(0, i - 1);
    else if (key === 'ArrowRight') i = Math.min(WORK.length - 1, i + 1);
    else if (key === 'ArrowUp') r = rowEl.previousElementSibling || rowEl;
    else if (key === 'ArrowDown') r = rowEl.nextElementSibling || rowEl;
    const cell = r.cells && r.cells[WORK[i]];
    if (cell && !cell.disabled) cell.focus();
    else if (cell) { const alt = Object.values(r.cells).find(x => !x.disabled); if (alt) alt.focus(); }
  }
  function updateRow(r, c) {
    OB.setText(r.who.querySelector('.pn'), OB.short(c.name));
    OB.setText(r.who.querySelector('.av span'), OB.initials(c.name));
    r.who.querySelector('.av').style.setProperty('--h', OB.hue(c.name));
    OB.setText(r.who.querySelector('.pm'), Math.round(c.mood) + '%');
    r.who.querySelector('.pm').style.color = OB.moodColor(c.mood);
    OB.toggle(r, 'sel', S.sel.indexOf(c.id) >= 0);
    for (const w of WORK) paint(r.cells[w], c, w);
  }

  function update(st) {
    if (!body) return;
    OB.reconcile(body, st.colonists, c => c.id, makeRow, updateRow);
    OB.setText(foot, st.colonists.length + ' colonists · ' + st.colonists.filter(c => c.drafted).length + ' drafted');
  }

  function colMenu(e, w) {
    const set = lv => () => { for (const c of S.state.colonists) setLevel(c.id, w, lv, null); update(S.state); };
    OB.ctx(e.clientX, e.clientY, [
      { icon: OB.workIcon(w), label: NAME[w] + ': set everyone to', disabled: true },
      { icon: 'star', label: 'Priority 1 (highest)', run: set(1) }, { icon: 'star', label: 'Priority 2', run: set(2) }, { icon: 'star', label: 'Priority 3', run: set(3) }, { icon: 'star', label: 'Priority 4 (lowest)', run: set(4) },
      '-', { icon: 'x', label: 'Never (0)', run: set(0) },
    ]);
  }

  OB.screens.reg('priorities', {
    build() {
      head = h('div.phead', { role: 'row' }, h('div.pcorner', h('span.lbl', 'Colonist')));
      for (const w of WORK) {
        const b = h('button.pcol', { 'aria-label': NAME[w] + ' column', on: { click: e => colMenu(e, w) } }, OB.icon(OB.workIcon(w)), h('span', NAME[w]));
        OB.tip(b, '<div class="tt-h">' + NAME[w] + '</div>' + HELP[w] + '<div class="muted" style="margin-top:.3rem">Click for set-all options' + (SKILL[w] ? ' · uses ' + SKILL[w] : '') + '</div>');
        head.append(b);
      }
      body = h('div.pbody', { role: 'rowgroup' });
      foot = h('span.muted.t-sm', '');
      table = h('div.ptable', { role: 'grid', 'aria-label': 'Work priorities' }, head, body);
      const legend = h('div.plegend', ...[1, 2, 3, 4, 0].map(l => h('span', h('i.pcell.static', { 'data-lv': l }, l || '·'), l === 1 ? 'highest' : l === 4 ? 'lowest' : l === 0 ? 'never' : '')), h('span.muted.t-xs', 'Ties are broken by work order, then urgency, then distance.'));
      root = h('div.panel.screen.priorities', h('div.panel-h', OB.icon('bars'), h('h2', 'Work priorities'), h('div.grow'), foot, h('button.btn.sq.ghost', { 'aria-label': 'Close', on: { click: () => OB.screens.close() } }, OB.icon('x'))),
        h('div.panel-b', h('p.muted.t-sm.pintro', 'Click a cell to cycle ', h('b', '0 → 4'), ' (1 is done first, 0 means never). Right-click goes back. Focus a cell and press ', OB.key('0'), '–', OB.key('4'), ' to set it, arrow keys to move.'), table, legend));
      return root;
    },
    onOpen() { if (S.state) update(S.state); setTimeout(() => { const first = body && body.querySelector('.pcell:not([disabled])'); if (first) first.focus({ preventScroll: true }); }, 30); },
    update,
  });
})();

<script>
/* Build menu (dock tab) + blueprint placement. Placement validity is computed here with the same rules as sim/blueprints.lua `why_not`
   (distance to base, prerequisites, max count, spacing) so the ghost tints instantly; the sim still has the final say (order_result). */
(function () {
  'use strict';
  const OB = window.OB, h = OB.h, S = OB.S, F = OB.fmt;
  const build = (OB.build = { placing: null });
  let cat = 'all', els = {};

  build.validate = function (bp, x, y) {
    const st = S.state, cata = S.catalog;
    if (!st || !cata) return { ok: false, reason: 'unknown' };
    const d = cata.blueprints[bp]; if (!d) return { ok: false, reason: 'unknown_blueprint' };
    const base = cata.tuning.base;
    if (Math.hypot(x - base.x, y - base.y) > base.build_radius) return { ok: false, reason: 'too_far' };
    for (const need of Object.keys(d.needs || {})) {
      const have = st.buildings.filter(b => b.bp === need && b.state === 'built').length;
      if (have < d.needs[need]) return { ok: false, reason: 'prereq:' + need };
    }
    if (d.max > 0 && st.buildings.filter(b => b.bp === bp).length >= d.max) return { ok: false, reason: 'max_reached' };
    for (const b of st.buildings) if (Math.hypot(b.x - x, b.y - y) < base.min_spacing) return { ok: false, reason: 'blocked' };
    return { ok: true, reason: 'ok' };
  };

  function views() { return [OB.mapBg, OB.screens.current === 'map' && OB.bigMap].filter(Boolean); }
  build.start = function (bp) {
    build.placing = bp;
    S.placing = bp;
    for (const v of views()) { v.ghost = { bp, x: null, y: null, ok: false, reason: 'ok' }; v.canvas.style.cursor = 'crosshair'; v.dirty = true; }
    OB.post('place', { op: 'start', bp });
    OB.emit('placing', bp);
    if (S.state) update(S.state);
  };
  build.cancel = function (silent) {
    const was = !!build.placing;
    build.placing = null; S.placing = null;
    for (const v of [OB.mapBg, OB.bigMap].filter(Boolean)) { v.ghost = null; v.canvas.style.cursor = 'default'; v.dirty = true; }
    if (was) { OB.post('place', { op: 'cancel' }); OB.emit('placing', null); if (S.state && !silent) update(S.state); }
    return was;
  };
  // the big map screen creates its view later: give it the active ghost
  OB.on('screen', () => { if (build.placing && OB.bigMap) { OB.bigMap.ghost = { bp: build.placing, x: null, y: null, ok: false, reason: 'ok' }; } });

  function statusOf(st, id, d) {
    const built = {};
    for (const b of st.buildings) { if (b.state === 'built') built[b.bp] = (built[b.bp] || 0) + 1; }
    const total = st.buildings.filter(b => b.bp === id).length;
    const missing = [];
    for (const need of Object.keys(d.needs || {})) if ((built[need] || 0) < d.needs[need]) missing.push(F.cap(F.snake(need)) + ' x' + d.needs[need] + ' (' + (built[need] || 0) + ' built)');
    return { missing, total, maxed: d.max > 0 && total >= d.max };
  }

  let list, queue, banner, tabs, cards = new Map(), lastSig = '';

  function makeCard(id) {
    const d = OB.bp(id), col = OB.catColor[d.cat] || '#9aa7bd';
    const mats = h('div.mats');
    for (const m of Object.keys(d.materials)) mats.append(h('span.mat', { dataset: { item: m } }, OB.icon(OB.itemIcon(m)), h('b', d.materials[m]), h('i', OB.item(m).name)));
    const stats = h('div.bstats',
      h('span', OB.icon('clock'), F.dur(d.work) + ' work'),
      d.power_use ? h('span.pw', OB.icon('bolt'), d.power_use + ' W') : null,
      d.power_gen ? h('span.pg', OB.icon('bolt'), '+' + d.power_gen + ' W') : null,
      d.defense ? h('span', OB.icon('shield'), '+' + d.defense) : null);
    const status = h('div.bstat');
    const card = h('button.bcard', { dataset: { id }, style: { '--c': col }, on: { click: () => { if (card.classList.contains('lock') && !card.classList.contains('maxed')) { OB.toast('warn', card.dataset.why || 'Locked', { title: d.name }); return; } build.start(id); } } },
      h('div.bi', OB.icon(OB.bpIcon(id))), h('div.bb', h('div.bn', d.name), stats, mats, status));
    OB.tip(card, () => { const x = OB.bp(id); return '<div class="tt-h">' + x.name + '</div><div class="tt-r"><span>Category</span><span>' + F.cap(x.cat) + '</span></div><div class="tt-r"><span>Work</span><span>' + x.work + ' min (avg skill)</span></div><div class="tt-r"><span>Min. construction skill</span><span>' + x.skill_min + '</span></div><div class="tt-r"><span>Hit points</span><span>' + x.hp + '</span></div>' + (x.max ? '<div class="tt-r"><span>Limit</span><span>' + x.max + '</span></div>' : '') + (x.storage_g ? '<div class="tt-r"><span>Adds storage</span><span>' + F.kg(x.storage_g) + '</span></div>' : '') + (x.tank_l ? '<div class="tt-r"><span>Water tank</span><span>' + x.tank_l + ' L</span></div>' : ''); }, 400);
    card.status = status;
    return card;
  }

  function update(st) {
    if (!list || !S.catalog) return;
    const order = S.catalog.blueprint_order.filter(id => cat === 'all' || OB.bp(id).cat === cat);
    const stock = new Map(st.stock.map(s => [s.id, s.n]));
    const sig = cat + '|' + order.join(',');
    if (sig !== lastSig) { lastSig = sig; OB.clear(list); list._keyed = null; for (const id of order) { let c = cards.get(id); if (!c) { c = makeCard(id); cards.set(id, c); } list.append(c); } }
    for (const id of order) {
      const c = cards.get(id), d = OB.bp(id), s = statusOf(st, id, d);
      const lock = s.missing.length > 0 || s.maxed;
      OB.toggle(c, 'lock', lock); OB.toggle(c, 'maxed', s.maxed);
      OB.toggle(c, 'on', build.placing === id);
      c.dataset.why = s.maxed ? 'Limit reached' : s.missing.length ? 'Needs ' + s.missing[0] : '';
      OB.setText(c.status, s.maxed ? 'Limit reached (' + s.total + '/' + d.max + ')' : s.missing.length ? 'Needs ' + s.missing.join(', ') : d.max ? s.total + ' / ' + d.max + ' built' : (s.total ? s.total + ' built' : 'Ready'));
      OB.toggle(c.status, 'warn', s.missing.length > 0);
      for (const m of c.querySelectorAll('.mat')) OB.toggle(m, 'short', (stock.get(m.dataset.item) || 0) < d.materials[m.dataset.item]);
    }
    // active placement banner
    OB.show(banner, !!build.placing);
    if (build.placing) { const d = OB.bp(build.placing); OB.setText(banner.firstChild.nextSibling, 'Placing ' + d.name); }
    // construction queue
    const sites = st.buildings.filter(b => b.state === 'planned');
    OB.setText(queue.hd, 'Construction sites (' + sites.length + ')');
    OB.reconcile(queue.list, sites, b => b.id, b => {
      const bar = OB.bar('thin');
      const row = h('div.site', { dataset: { id: b.id } }, OB.icon(OB.bpIcon(b.bp)), h('div.grow', h('div.sn', ''), h('div.sm.muted.t-xs', ''), bar), h('button.btn.sq.sm.ghost', { 'aria-label': 'Cancel', on: { click: () => OB.order('colony', 'cancel_blueprint', { id: b.id }) } }, OB.icon('x')));
      row.bar = bar; row.sn = row.querySelector('.sn'); row.sm = row.querySelector('.sm');
      return row;
    }, (row, b) => {
      OB.setText(row.sn, OB.bp(b.bp).name);
      const miss = b.missing ? Object.keys(b.missing).map(k => b.missing[k] + ' ' + OB.item(k).name).join(', ') : '';
      OB.setText(row.sm, b.missing ? 'waiting for ' + miss : b.pct + '% built');
      row.bar.set(b.pct, b.missing ? 'var(--warn)' : 'var(--good)');
    });
    OB.show(queue.empty, sites.length === 0);
  }

  build.panel = function () {
    const root = h('div.build-panel');
    tabs = h('div.ctabs.wrap');
    const cats = ['all'].concat((S.catalog && S.catalog.blueprint_cats) || ['structure', 'defense', 'furniture', 'production', 'power', 'storage', 'water', 'utility']);
    for (const c of cats) tabs.append(h('button.chip.tab' + (c === cat ? '.on' : ''), { dataset: { cat: c }, style: { '--c': OB.catColor[c] || '#f6b44f' }, on: { click: () => { cat = c; OB.$$('.tab', tabs).forEach(b => b.classList.toggle('on', b.dataset.cat === c)); if (S.state) update(S.state); } } }, c === 'all' ? 'All' : OB.icon(OB.catIcon(c)), c === 'all' ? null : F.cap(c)));
    banner = h('div.pbanner', OB.icon('ghost'), h('b', 'Placing'), h('span.muted', 'Click to place · Shift to chain · Esc or right-click to cancel'), h('button.btn.sm', { on: { click: () => build.cancel() } }, 'Done'));
    banner.hidden = true;
    list = h('div.bgrid');
    queue = { hd: h('div.lbl', 'Construction sites'), list: h('div.sites'), empty: h('div.muted.t-sm', 'Nothing under construction. Pick a blueprint, then ' + (OB.touch && OB.touch.on ? 'tap' : 'click') + ' the map.') };
    root.append(tabs, banner, list, h('div.sep'), queue.hd, queue.list, queue.empty);
    OB.on('catalog', () => { lastSig = ''; });
    return { el: root, update, onShow() { lastSig = ''; } };
  };
})();
</script>
<script>
/* Stockpile zones (dock tab): priority, accepted categories, capacity, contents; plus "new zone" placement on the map. */
(function () {
  'use strict';
  const OB = window.OB, h = OB.h, S = OB.S, F = OB.fmt;
  const zones = (OB.zones = { draft: { name: 'Stockpile', tiles: 4, prio: 3, cats: null } });
  let root, listEl, capBar, capTxt, formEls = {};

  zones.createAt = function (x, y) {
    OB.order('colony', 'zone_create', { name: 'Stockpile', pos: { x, y, z: 0 }, tiles: 4, prio: 3 });
  };
  zones.start = function () {
    if (OB.build.cancel) OB.build.cancel(true); // (before the flag: the cancel wrapper below also stops a zone placement, which used to switch the flag straight off again, so Esc / right-click could not cancel it)
    zones.placing = true;
    for (const v of [OB.mapBg, OB.bigMap].filter(Boolean)) { v.ghost = { zone: true, tiles: zones.draft.tiles, x: null, y: null, ok: true }; v.canvas.style.cursor = 'crosshair'; v.dirty = true; }
    OB.toast('info', (OB.touch && OB.touch.on ? 'Tap the map to place "' : 'Click the map to place "') + zones.draft.name + '" (' + zones.draft.tiles + ' tiles).' + (OB.touch && OB.touch.on ? '' : ' Esc cancels.'), { title: 'New stockpile zone', icon: 'zone' });
  };
  zones.stop = function () { zones.placing = false; for (const v of [OB.mapBg, OB.bigMap].filter(Boolean)) { if (v.ghost && v.ghost.zone) v.ghost = null; v.canvas.style.cursor = 'default'; v.dirty = true; } };
  zones.commit = function (g) {
    const d = zones.draft;
    const t = { name: d.name || 'Stockpile', pos: { x: g.x, y: g.y, z: 0 }, tiles: d.tiles, prio: d.prio };
    if (d.cats) t.cats = Array.from(d.cats);
    OB.order('colony', 'zone_create', t);
    zones.stop();
  };
  // Esc cancels a pending zone placement as well
  const prevCancel = OB.build.cancel;
  OB.build.cancel = function (silent) { const z = zones.placing; if (z) zones.stop(); return prevCancel(silent) || !!z; };

  function catChips(active, onToggle) {
    const wrap = h('div.catchips');
    for (const c of (S.catalog ? S.catalog.item_cats : [])) {
      const on = !active || active.has(c);
      wrap.append(h('button.chip.tab' + (on ? '.on' : ''), { style: { '--c': OB.catColor[c] }, dataset: { cat: c }, 'aria-pressed': on ? 'true' : 'false', on: { click: () => onToggle(c) } }, OB.icon(OB.catIcon(c)), F.cap(c)));
    }
    return wrap;
  }

  function zoneCard(z) {
    const bar = OB.bar('thick');
    const prio = h('div.stepper', h('button.btn.sq.sm', { 'aria-label': 'Lower priority', on: { click: () => OB.order('colony', 'zone_set', { id: z.id, prio: Math.max(1, z.prio - 1) }) } }, OB.icon('minus')), h('b.num', ''), h('button.btn.sq.sm', { 'aria-label': 'Raise priority', on: { click: () => OB.order('colony', 'zone_set', { id: z.id, prio: Math.min(5, z.prio + 1) }) } }, OB.icon('plus')));
    const chipsHost = h('div');
    const top = h('div.ztop');
    const card = h('div.zcard', { dataset: { id: z.id } },
      h('div.zh', OB.icon(z.main ? 'crate' : 'zone'), h('b.grow.ell', ''), h('span.lbl', 'Priority'), prio),
      bar, h('div.zmeta.muted.t-xs', ''), top, chipsHost,
      h('div.row', h('button.btn.sm', { on: { click: () => OB.screens.open('inventory', { other: { kind: 'zone', id: z.id } }) } }, OB.icon('search'), 'Open contents')));
    card.bar = bar; card.ttl = card.querySelector('.zh b'); card.prio = prio.querySelector('b'); card.meta = card.querySelector('.zmeta'); card.top = top; card.chipsHost = chipsHost;
    return card;
  }
  function zoneUpdate(card, z) {
    OB.setText(card.ttl, z.name + (z.main ? ' (main)' : ''));
    OB.setText(card.prio, z.prio);
    const used = z.cap ? z.w / z.cap * 100 : 0;
    card.bar.set(used, used > 90 ? 'var(--bad)' : used > 70 ? 'var(--warn)' : 'var(--blue)');
    OB.setText(card.meta, F.kg(z.w) + ' / ' + F.kg(z.cap) + ' · ' + z.stacks + ' stacks · ' + z.tiles + ' tiles');
    const sig = z.top.map(t => t.id + t.n).join(',');
    if (card.top._s !== sig) { card.top._s = sig; OB.clear(card.top); for (const t of z.top) card.top.append(h('span.chip', { style: { '--c': OB.catColor[OB.item(t.id).cat] || '#9aa7bd' } }, OB.icon(OB.itemIcon(t.id)), OB.item(t.id).name + ' ×' + t.n)); if (!z.top.length) card.top.append(h('span.muted.t-xs', 'Empty')); }
    const csig = z.cats ? z.cats.join(',') : '*';
    if (card.chipsHost._s !== csig) {
      card.chipsHost._s = csig; OB.clear(card.chipsHost);
      const active = z.cats ? new Set(z.cats) : null;
      card.chipsHost.append(h('div.lbl', { style: { margin: '.5rem 0 .25rem' } }, 'Accepts'), catChips(active, c => {
        const all = S.catalog.item_cats;
        const cur = new Set(z.cats || all);
        if (cur.has(c)) cur.delete(c); else cur.add(c);
        if (cur.size === 0) { OB.toast('warn', 'A zone must accept at least one category.'); return; }
        OB.order('colony', 'zone_set', { id: z.id, cats: all.filter(x => cur.has(x)) });
      }));
    }
  }

  function update(st) {
    const r = st.res;
    capBar.set(r.stock_cap ? r.stock_g / r.stock_cap * 100 : 0, r.stock_g / Math.max(1, r.stock_cap) > 0.9 ? 'var(--bad)' : 'var(--blue)');
    OB.setText(capTxt, F.kg(r.stock_g) + ' of ' + F.kg(r.stock_cap) + ' stored across ' + st.zones.length + ' zones');
    OB.reconcile(listEl, st.zones, z => z.id, zoneCard, zoneUpdate);
  }

  zones.panel = function () {
    root = h('div.zones-panel');
    capBar = OB.bar('thick'); capTxt = h('div.muted.t-sm', '');
    listEl = h('div.zlist');
    // new zone form
    formEls.name = h('input', { type: 'text', value: zones.draft.name, maxLength: 24, 'aria-label': 'Zone name', on: { input: e => (zones.draft.name = e.target.value) } });
    formEls.tiles = h('input', { type: 'range', min: 1, max: 12, value: zones.draft.tiles, 'aria-label': 'Zone size', on: { input: e => { zones.draft.tiles = +e.target.value; OB.setText(formEls.tv, e.target.value + ' tiles'); } } });
    formEls.tv = h('b.num', zones.draft.tiles + ' tiles');
    formEls.prio = OB.seg([1, 2, 3, 4, 5].map(v => ({ value: v, label: String(v) })), zones.draft.prio, v => (zones.draft.prio = v));
    const form = h('div.zform', h('div.lbl', 'New zone'), formEls.name, h('div.row', h('span.muted.t-sm', 'Size'), formEls.tiles, formEls.tv), h('div.row', h('span.muted.t-sm', 'Priority'), formEls.prio), h('button.btn.primary', { on: { click: () => zones.start() } }, OB.icon('zone'), 'Place on map'));
    root.append(h('div.lbl', 'Storage'), capBar, capTxt, h('div.sep'), listEl, h('div.sep'), form);
    return { el: root, update, onShow() {} };
  };
})();
</script>
<script>
/* Expeditions (dock tab): plan scavenging trips by vehicle or on foot, watch forming / active trips. Sends `order expedition` / `cancel_expedition`. */
(function () {
  'use strict';
  const OB = window.OB, h = OB.h, S = OB.S, F = OB.fmt;
  const exped = (OB.exped = { pick: null, size: 2, mode: 'vehicle' });
  let root, dlist, active, info, goBtn, modeSeg, sizeSeg;
  const STATE_LABEL = { forming: 'Forming', outbound: 'Outbound', looting: 'Searching', returning: 'Returning' };

  function update(st) {
    const cat = S.catalog; if (!cat) return;
    if (!dlist.children.length) {
      for (const d of cat.districts.slice().sort((a, b) => a.danger - b.danger || a.travel - b.travel)) {
        const pips = h('span.dpips', ...Array.from({ length: 5 }, (_, i) => h('i' + (i < d.danger ? '.on' : ''))));

<script>

(function () {
  'use strict';
  const OB = window.OB, h = OB.h, S = OB.S, F = OB.fmt;

  const EV = {
    horde_wave: ['Horde wave', 'skull'], gang_raid: ['Gang raid', 'swords'], infection_outbreak: ['Infection outbreak', 'bio'], helicopter_flyover: ['Helicopter flyover', 'radio'],
    power_outage: ['Power outage', 'bolt'], water_outage: ['Water outage', 'drop'], storm: ['Storm', 'storm'], caravan: ['Trade caravan', 'trade'], supply_drop: ['Supply drop', 'crate'], refugee_arrival: ['Refugee arrival', 'person'],
  };
  OB.eventInfo = id => EV[id] || [F.cap(F.snake(id)), 'alert'];
  const CAT_COL = { threat: 'var(--bad)', hazard: 'var(--warn)', boon: 'var(--good)' };
  let root, el = {}, tab = 'log', sig = '';

  function update(st) {
    const d = st.director, t = st.threat;

    el.meter.dataset.level = t.label.toLowerCase();

        }
        if (!d.log.length) el.logBox.append(h('div.muted.t-sm', 'The Director has not sent anything yet. Day 1 is a grace day.'));
      }

  }

  function renderNotes() {

    if (el.noteBox._s === nsig) return;

    }
    if (!n.length) el.noteBox.append(h('div.muted.t-sm', 'No messages yet.'));
  }

  director.panel = function () {
    root = h('div.director-panel');
    el.seg = h('div.segbar', ...Array.from({ length: 10 }, () => h('i')));
    el.lvl = h('b.disp', 'Quiet'); el.near = h('div.muted.t-sm', '');

    el.budget = OB.bar('thick'); el.bnum = h('b.num', ''); el.rate = h('span.muted.t-sm', ''); el.next = h('div.muted.t-sm', '');
    el.profile = OB.seg(['calm', 'escalating', 'chaos'].map(p => ({ value: p, label: F.cap(p), tip: { calm: 'Long quiet stretches, boons weighted up', escalating: 'Gentle start, steady ramp', chaos: 'Short gaps, spikes, little rest' }[p] })), 'escalating', p => OB.order('colony', 'set_profile', p));
    el.chart = h('div.dchart');
    el.threats = h('div.tlist'); el.noThreat = h('div.muted.t-sm', 'No hostile groups tracked right now.');
    el.logBox = h('div.logbox'); el.noteBox = h('div.logbox'); el.noteBox.hidden = true;
    const tabs = OB.seg([{ value: 'log', label: 'Director log' }, { value: 'notes', label: 'Messages' }], 'log', v => { tab = v; sig = ''; el.noteBox._s = ''; if (S.state) update(S.state); }, 'ctabs');
    root.append(el.meter,
      h('section.csec', h('div.row.between', h('span.lbl', 'Storyteller budget'), el.bnum), el.budget, h('div.row.between', el.rate, el.next), el.profile),
      h('section.csec', h('div.lbl', 'Events per day'), el.chart, h('div.legend', h('span', h('i.ev-t'), 'threat'), h('span', h('i.ev-h'), 'hazard'), h('span', h('i.ev-b'), 'boon'))),

      stat('Expeditions', st.expeditions_done || 0, 'truck'), stat('Survivors taken in', st.refugees || 0, 'person'), stat('Trades', st.trades || 0, 'trade'),
      stat('Mental breaks', st.mental_breaks || 0, 'alert'), stat('Infections cured', st.infections_cured || 0, 'cross'), stat('Wealth peak', d.wealth_peak || 0, 'star'));
    const charts = h('div.scharts');

    const table = h('table.stable', h('thead', h('tr', h('th', 'Day'), h('th', 'Colonists'), h('th', 'Mood'), h('th', 'Wealth'))), h('tbody', ...d.history.map(r => h('tr', h('td', r.day), h('td', r.colonists), h('td', Math.round(r.mood) + '%'), h('td', F.n(r.wealth))))));
    table.hidden = true;
    const tg = h('button.btn.sm.ghost', { on: { click: () => { table.hidden = !table.hidden; charts.hidden = !table.hidden; tg.lastChild.textContent = table.hidden ? 'Table view' : 'Chart view'; } } }, OB.icon('list'), h('span', 'Table view'));
    sbody.append(hero, grid, h('div.row.between', h('div.lbl', 'Colony over time'), tg), charts, table, h('div.lbl', { style: { marginTop: '1rem' } }, 'Colonists lost (' + lost.length + ')'), lostEl,
      h('div.meta.muted.t-xs', 'Profile ' + d.profile + ' · seed ' + d.seed + ' · ' + d.threat_events + ' threat events'));

  OB.screens.reg('summary', {

        h('button.btn.primary', { on: { click: () => { OB.ui('new_game', { seed: Math.floor(Math.random() * 90000) + 1, profile: summary ? summary.profile : 'escalating' }); OB.screens.close(); } } }, OB.icon('flag'), 'New colony'),
        h('button.btn.sq.ghost', { 'aria-label': 'Close', on: { click: () => OB.screens.close() } }, OB.icon('x'))), sbody);

<script>
/* Outbreak NUI main: routes game messages ({action, data} from SendNUIMessage), applies state, owns the keyboard and the mode switch. */
(function () {
  'use strict';
  const OB = window.OB, S = OB.S;

  OB.perf = { n: 0, sum: 0, max: 0, last: 0, samples: [] };
  const REASONS = {
    blocked: 'Something is already built there.', too_far: 'Too far from the base.', max_reached: 'You already have the maximum of those.', unknown_blueprint: 'Unknown blueprint.',
    no_such_colonist: 'That colonist is gone.', bad_target: 'That order makes no sense here.', no_vehicle: 'No vehicle is available.', vehicle_damaged: 'The vehicle is too damaged.',
    no_fuel: 'Not enough fuel cans for the trip.', too_far_on_foot: 'Too far to go on foot.', no_crew: 'Nobody is free to go.', not_in_stock: 'Not in the stockpile.',
    offer_too_low: 'The offer is too low.', clamped: 'Level adjusted.',
  };
  OB.reason = r => { r = String(r || ''); if (r.indexOf('prereq:') === 0) return 'Needs a finished ' + OB.fmt.snake(r.slice(7)) + ' first.'; if (r.indexOf('rejected:') === 0) return 'Rejected by the server.'; return REASONS[r] || OB.fmt.cap(OB.fmt.snake(r)); };

  // ------------------------------------------------------------------------------------------------------------ mode
  OB.setMode = function (mode) {
    if (mode !== 'colony') mode = 'survival';
    S.mode = mode;
    document.documentElement.dataset.mode = mode;
    OB.show(OB.$('#colony'), mode === 'colony');
    if (mode === 'colony') { OB.colony.enter(); } else { OB.colony.leave(); if (OB.screens.current === 'map' || OB.screens.current === 'priorities') OB.screens.close(); }
    OB.ui('screens', { colony: mode === 'colony' });
    OB.emit('mode', mode);
  };
  OB.requestMode = function (mode) { OB.post('mode', { mode }); if (!S.boot) OB.setMode(mode); };

  // ------------------------------------------------------------------------------------------------------------ events
  function onEvent(ev, silent) {
    if (!ev || !ev.type) return;
    S.events.push(ev);
    if (S.events.length > 300) S.events.shift();
    switch (ev.type) {
      case 'notify': if (!silent) OB.toast(ev.level, ev.text); OB.note(ev.level, ev.text, ev); break;
      case 'play_alert': {
        const t = { horde_near: ['Hordes nearby', 'The dead are close to the base.'], raid_incoming: ['Raid incoming', (ev.faction ? OB.fmt.cap(OB.fmt.snake(ev.faction)) + ' raiders are coming.' : 'Raiders are coming.')],
          caravan: ['Caravan', 'Traders have arrived.'], helicopter: ['Helicopter', 'A helicopter passes overhead.'], supply_drop: ['Supply drop', 'A crate has landed nearby.'] }[ev.kind];
        if (t && !silent) OB.toast(ev.kind === 'caravan' || ev.kind === 'supply_drop' ? 'good' : 'warn', t[1], { title: t[0], icon: ev.kind === 'caravan' ? 'trade' : ev.kind === 'supply_drop' ? 'crate' : 'radar' });
        break;
      }
      case 'order_result': if (!silent && !ev.ok && ev.reason) OB.toast('warn', OB.reason(ev.reason), { title: 'Order failed' }); break;
      case 'item_result': if (!silent && !ev.ok && ev.reason && ev.reason !== 'ok') OB.toast('warn', ev.reason === 'nothing_moved' ? 'Nothing could be moved (full or not enough).' : OB.reason(ev.reason)); break;
      case 'game_over': OB.screens.open('summary'); break;
      case 'day_start': if (!silent) OB.toast('info', 'Day ' + ev.day + ' begins.', { icon: 'sun' }); break;
      case 'colonist_turned': if (!silent) OB.toast('bad', ev.name + ' has turned.', { icon: 'skull' }); break;
      default: break;
    }
    OB.emit('ev:' + ev.type, ev);
    OB.emit('event', ev);
  }

  // ------------------------------------------------------------------------------------------------------------ state
  function applyState(st) {
    const t0 = performance.now();
    S.state = st;
    S.stateCount++;
    // keep the selection valid
    const ids = new Set(st.colonists.map(c => c.id));
    S.sel = S.sel.filter(id => ids.has(id));
    if (S.primary && !ids.has(S.primary)) S.primary = S.sel[0] || null;
    if (S.mode === 'colony') { OB.colony.update(st); OB.map.updateAll(st); }
    OB.screens.update(st);
    OB.emit('state', st);
    const dt = performance.now() - t0;
    const p = OB.perf;
    p.n++; p.sum += dt; p.last = dt; if (dt > p.max) p.max = dt;
    p.samples.push(dt); if (p.samples.length > 200) p.samples.shift();
  }

  // ------------------------------------------------------------------------------------------------------ message router
  const ROUTE = {
    boot(d) {
      S.boot = d || {};
      OB.show(OB.$('#preview-badge'), !!(d && (d.preview || d.badge)) || OB.preview);
      if (d && d.badge) OB.$('#preview-badge').textContent = d.badge;
      if (d && d.settings) { Object.assign(OB.settings, d.settings); OB.applySettings(); }
    },
    catalog(d) { S.catalog = d; OB.emit('catalog', d); },
    state: applyState,
    hud(d) { OB.emit('hud', d); },
    compass(d) { OB.emit('compass', d && d.heading != null ? d.heading : d); },
    event: onEvent,
    events(d) {
      d = d || [];
      const silent = d.length > 12; // fast-forward / resync bursts: log them, do not spam toasts
      d.forEach(e => onEvent(e, silent));
      if (silent) { const bad = d.filter(e => e.type === 'colonist_died').length; if (bad) OB.toast('bad', d.length + ' events processed, ' + bad + ' colonist(s) lost.', { icon: 'list' }); } // (a join / load resync is not news)
    },
    mode(d) { OB.setMode(d && d.mode); },
    screen(d) { if (d && d.open === false) OB.screens.close(); else if (d && d.name) OB.screens.open(d.name, d.arg); },
    selection(d) { if (d && d.ids) { S.sel = d.ids.slice(); S.primary = d.ids[0] || null; OB.emit('selection', S.sel); if (S.primary) OB.ui('select', { id: S.primary }); } },
    inventory(d) { S.inv = d; OB.emit('inventory', d); },
    summary(d) { OB.emit('summary', d); },
    toast(d) { if (d) OB.toast(d.level, d.text, d); },
    place(d) { OB.emit('place', d); },
    settings(d) { Object.assign(OB.settings, d || {}); OB.applySettings(); },
    note(d) { if (d) OB.note(d.level, d.text); },
  };
  window.addEventListener('message', e => {
    const m = e.data;
    if (!m || typeof m.action !== 'string') return;
    const f = ROUTE[m.action];
    if (f) { try { f(m.data); } catch (err) { console.error('[OB] ' + m.action + ' failed', err); } }
  });

  // -------------------------------------------------------------------------------------------------------------- keys
  OB.selectNext = function (dir) {
    const cs = S.state ? S.state.colonists : [];
    if (!cs.length) return;
    let i = cs.findIndex(c => c.id === S.primary);
    i = (i + dir + cs.length) % cs.length;
    OB.select([cs[i].id]);
  };
  OB.select = function (ids, add) {
    ids = ids.filter(Boolean);
    S.sel = add ? Array.from(new Set(S.sel.concat(ids))) : ids.slice();
    S.primary = S.sel[S.sel.length - 1] || null;
    if (S.primary) OB.ui('select', { id: S.primary }); else OB.ui('select', { id: '' });
    OB.emit('selection', S.sel);
    if (S.state && S.mode === 'colony') { OB.colony.update(S.state); OB.map.updateAll(S.state); }
  };

  // The page owns the keyboard while it has NUI focus, so the game never sees WASD: the camera keys are forwarded to the Lua client (client/camera.lua
  // on_key) as down / up pairs. Keys still held when the window loses focus or a screen opens are released, so the camera never keeps drifting.
  const CAM_KEYS = { w: 'w', a: 'a', s: 's', d: 'd', q: 'q', e: 'e', ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown', ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight', Shift: 'shift' };
  const heldKeys = new Set();
  OB.releaseKeys = function () { heldKeys.forEach(k => OB.post('key', { k, down: false })); heldKeys.clear(); };
  document.addEventListener('keyup', e => {
    const k = CAM_KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
    if (k && heldKeys.delete(k)) OB.post('key', { k, down: false });
  });
  window.addEventListener('blur', () => OB.releaseKeys());
  OB.on('screen', () => { if (OB.screens.current) OB.releaseKeys(); });

  document.addEventListener('keydown', e => {
    const tag = (e.target && e.target.tagName) || '';
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag);
    if (!typing && S.mode === 'colony' && !OB.screens.current && !e.ctrlKey && !e.altKey && !e.metaKey) {
      const ck = CAM_KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
      if (ck && !heldKeys.has(ck)) { heldKeys.add(ck); OB.post('key', { k: ck, down: true }); }
    }
    if (e.key === 'Escape') {
      if (!OB.$('#ctx').hidden) { OB.closeCtx(); return e.preventDefault(); }
      if (OB.build && OB.build.cancel()) return e.preventDefault();
      if (OB.screens.current) { OB.screens.close(); return e.preventDefault(); }
      if (S.mode === 'colony' && S.dock !== 'card' && OB.colony.setDock) { OB.colony.setDock('card'); return e.preventDefault(); }
      OB.screens.open('menu');
      return e.preventDefault();
    }
    if (typing || e.ctrlKey && e.key !== 'a' || e.altKey || e.metaKey) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === 'F6' || (k === 'Tab' && !OB.screens.current)) { OB.requestMode(S.mode === 'colony' ? 'survival' : 'colony'); return e.preventDefault(); }
    if (k === 'i') { OB.screens.toggle('inventory'); return e.preventDefault(); }
    if (S.mode !== 'colony') return;
    switch (k) {
      case 'b': OB.screens.close(); OB.colony.setDock('build'); break;
      case 'z': OB.screens.close(); OB.colony.setDock('zones'); break;
      case 'l': OB.screens.close(); OB.colony.setDock('director'); break;
      case 'c': OB.screens.close(); OB.colony.setDock('card'); break;
      case 'p': OB.screens.toggle('priorities'); break;
      case 'm': OB.screens.toggle('map'); break;
      case ' ': OB.ui('toggle_pause'); break;
      case '1': OB.ui('set_speed', { speed: 1 }); break;
      case '2': OB.ui('set_speed', { speed: 2 }); break;
      case '3': OB.ui('set_speed', { speed: 4 }); break;
      case '4': OB.ui('set_speed', { speed: 8 }); break;
      case 'r': OB.colony.toggleDraft(); break;
      case 'a': if (e.ctrlKey && S.state) { OB.select(S.state.colonists.map(c => c.id)); } break;
      case '.': OB.selectNext(1); break;
      case ',': OB.selectNext(-1); break;
      default: return;
    }
    e.preventDefault();
  });

  // ------------------------------------------------------------------------------------------------------------- init
  function init() {
    OB.applySettings();
    OB.hud.init();
    OB.colony.init();
    for (const name of ['inventory', 'priorities', 'map', 'menu', 'summary']) if (!OB.screens.has(name)) console.warn('[OB] screen missing: ' + name);
    OB.post('ready', { v: OB.v });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
<script>
/* Outbreak touch layer: the same UI on a phone or tablet (portrait, landscape, 820x1180). Loaded last; on a desktop it only sets data-ui="desktop"
   and does nothing else, so the desktop UI is untouched. In touch mode it sets data-ui="touch" and css/mobile.css re-lays the panels out as bottom sheets /
   side drawers; this file adds what CSS cannot:
     * the map: one-finger pan, two-finger pinch zoom (+ pan), tap to select, long-press = right-click menu, "Select" mode (drag a box), "Order" mode (tap
       the destination), placement ghost you tap / drag with confirm + cancel buttons (OB.MapView calls OB.touch.map() for touch pointers only);
     * long-press on any element = its context menu (rows, priority cells, inventory slots) or, if it has none, its tooltip; tap on a resource = its tooltip;
     * the dock as a sheet (closed / open / full, drag the grip), the resource bar scroller + collapse, safe-area / viewport layout variables.
   Mode: ?touch=1 or ?touch=0 (also on the preview shell), localStorage outbreak.touch, else a coarse primary pointer without hover, else a window < 720 px wide. */
(function () {
  'use strict';
  const OB = window.OB, h = OB.h, S = OB.S;
  const root = document.documentElement;
  const touch = (OB.touch = { on: false, selectMode: false, orderMode: false, keepPlacing: false, sheet: 'closed', lastType: '', lastAt: 0, swallow: false, map() { return false; }, helpView() { return null; } });

  function detect() {
    let q = location.search;
    try { if (window.parent !== window) q += '&' + window.parent.location.search.slice(1); } catch (e) { /* cross-origin parent */ }
    const f = new URLSearchParams(q).get('touch');
    if (f === '1' || f === '0') return f === '1';
    try { const v = localStorage.getItem('outbreak.touch'); if (v === '1' || v === '0') return v === '1'; } catch (e) { /* storage blocked */ }
    const mm = s => !!(window.matchMedia && matchMedia(s).matches);
    return (mm('(pointer: coarse)') && mm('(hover: none)')) || innerWidth < 720;
  }
  touch.on = detect();
  root.dataset.ui = touch.on ? 'touch' : 'desktop';
  if (!touch.on) return;

  OB.on('mode', m => { if (m !== 'colony') { touch.setOrder(false); touch.setSheet('closed'); } measure(); });
  OB.on('screen', name => {
    if (name === 'priorities') { const p = OB.$('.pintro'); if (p && !p._t) { p._t = 1; p.textContent = 'Tap a cell to cycle 0 → 4 (1 is done first, 0 means never). Long-press a cell to go back one step; tap a column header for set-everyone options.'; } }
    if (name) { touch.setOrder(false); if (OB.build.placing || (OB.zones && OB.zones.placing)) OB.build.cancel(true); } // the confirm bar lives under the screens
    renderBar();
  });
  // zone placement has no event of its own: wrap its start / stop
  if (OB.zones) {
    const z = OB.zones, s0 = z.start, e0 = z.stop;
    z.start = function () { s0.apply(this, arguments); onPlacing(); };
    z.stop = function () { e0.apply(this, arguments); renderBar(); };
  }
  // inventory: a drag would scroll the list, so a tap on a stack opens its menu (use / move / half / one / drop)
  document.addEventListener('click', e => {
    const slot = e.target instanceof Element && e.target.closest('#screens .slot.full'); if (!slot) return;
    const b = slot.getBoundingClientRect();
    slot.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: b.left + b.width / 2, clientY: b.top + b.height / 2, button: 2, view: window }));
  });

  // ------------------------------------------------------------------------------------------------------------- help text
  touch.helpView = function () {
    const row = (k, d) => h('div.krow', h('span.keycaps', h('b', k)), h('span', d));
    return h('div.keys',
      row('Tap', 'Select a colonist or a building; tap empty ground to deselect'),
      row('Drag', 'Pan the map (one finger)'), row('Pinch', 'Zoom the map (two fingers; they also pan)'),
      row('Long-press', 'The right-click menu: move here, dismantle, new stockpile zone. On a colonist, a priority cell or an item: its menu. On a button: its tooltip'),
      row('Select', 'Switch on, then drag a box around colonists. Taps add or remove. Long-press the button to select everyone'),
      row('Order', 'With colonists selected: tap Order, then tap where they should go'),
      row('Build', 'Open the Build tab, pick a blueprint: tap or drag the ghost, then Place'),
      row('Priorities', 'Tap a cell to cycle 0 to 4; long-press goes back a step'),
      row('Sheet', 'Tap a tab to open its panel, tap it again to close; drag the grip to resize'),
      row('Resources', 'Tap a resource for details; tap the clock to hide the row'));
  };
})();
</script>
