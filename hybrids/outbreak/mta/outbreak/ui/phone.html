<style>
/* Outbreak NUI: tokens, type scale, glass panels and the shared widgets. Everything is sized in rem so the whole UI scales with the
   viewport: 1920x1080 -> 16px rem, 2560x1440 -> 21.3px, 3840x2160 -> 32px (16:9 locked by min(vw/120, vh/67.5)). */
@font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url('fonts/inter-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 500; font-display: swap; src: url('fonts/inter-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 600; font-display: swap; src: url('fonts/inter-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 700; font-display: swap; src: url('fonts/inter-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 500; font-display: swap; src: url('fonts/barlow-condensed-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-display: swap; src: url('fonts/barlow-condensed-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-display: swap; src: url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2'); }

:root {
  --ui-scale: 1;
  --hud-opacity: 1;
  --bg0: #06090f;
  --glass-a: rgba(26, 33, 47, .80);
  --glass-b: rgba(11, 15, 23, .86);
  --glass-flat: rgba(14, 18, 27, .78);
  --stroke: rgba(255, 255, 255, .075);
  --stroke2: rgba(255, 255, 255, .15);
  --hi: rgba(255, 255, 255, .06);
  --text: #eaf0f9;
  --muted: #94a1b7;
  --dim: #62708a;
  --amber: #f6b44f;
  --amber2: #ffd38a;
  --amber-d: #b9772a;
  --teal: #3fe0c5;
  --blue: #66adff;
  --good: #35d39a;
  --warn: #f5a524;
  --bad: #ff5d6c;
  --info: #6aa8ff;
  --hp: #ff5d6c;
  --hunger: #ffa24a;
  --thirst: #47c7f5;
  --fatigue: #a78bff;
  --bleed: #ff3b5c;
  --infect: #a6e63c;
  --weight: #c9d2e3;
  --font-ui: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Inter', system-ui, sans-serif;
  --r: .75rem;
  --r-s: .5rem;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --shadow: 0 .75rem 2.5rem rgba(0, 0, 0, .5), 0 .125rem .5rem rgba(0, 0, 0, .35);
}
:root[data-cb="1"] { --good: #4aa3ff; --bad: #ffb000; --warn: #e6e6e6; --hp: #ffb000; --bleed: #ff8a00; --infect: #4aa3ff; }

html { font-size: calc(clamp(11px, min(100vw / 120, 100vh / 67.5), 48px) * var(--ui-scale)); height: 100%; }
body {
  margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--text);
  font: 400 .9375rem/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  user-select: none; -webkit-user-select: none; font-feature-settings: 'tnum' 1, 'cv11' 1;
}
#app { position: fixed; inset: 0; overflow: hidden; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus { outline: none; }
:focus-visible { outline: .125rem solid var(--amber); outline-offset: .125rem; border-radius: .25rem; }
h1, h2, h3, h4, p { margin: 0; }
svg.ic { width: 1.25em; height: 1.25em; flex: none; vertical-align: -.2em; overflow: visible; }
::-webkit-scrollbar { width: .5rem; height: .5rem; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .14); border-radius: .5rem; border: .125rem solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- type scale ---------- */
.t-xs { font-size: .6875rem; } .t-sm { font-size: .8125rem; } .t-md { font-size: 1.0625rem; } .t-lg { font-size: 1.25rem; }
.t-xl { font-size: 1.625rem; } .t-2xl { font-size: 2.25rem; } .t-3xl { font-size: 3.25rem; }
.disp { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; line-height: 1; }
.lbl { font-size: .6875rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.num { font-variant-numeric: tabular-nums; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); } .info { color: var(--info); } .amber { color: var(--amber); }
.row { display: flex; align-items: center; gap: .5rem; } .col { display: flex; flex-direction: column; gap: .5rem; }
.grow { flex: 1 1 auto; min-width: 0; } .gap1 { gap: .25rem; } .gap3 { gap: .75rem; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- glass panel ---------- */
.panel {
  background: linear-gradient(180deg, var(--glass-a), var(--glass-b));
  border: 1px solid var(--stroke); border-radius: var(--r); box-shadow: var(--shadow), inset 0 1px 0 var(--hi);
  -webkit-backdrop-filter: blur(.9rem) saturate(1.3); backdrop-filter: blur(.9rem) saturate(1.3);
}
.panel-h { display: flex; align-items: center; gap: .625rem; padding: .75rem 1rem; border-bottom: 1px solid var(--stroke); }
.panel-h h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; letter-spacing: .06em; text-transform: uppercase; }
.panel-h .ic { color: var(--amber); width: 1.25rem; height: 1.25rem; }
.panel-b { padding: 1rem; }
.sep { height: 1px; background: var(--stroke); margin: .5rem 0; }
.card-in { animation: rise .28s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(.5rem); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes glow { 0%, 100% { filter: drop-shadow(0 0 0 var(--c, var(--bad))); } 50% { filter: drop-shadow(0 0 .5rem var(--c, var(--bad))); } }
:root[data-reduce-motion="1"] *, :root[data-reduce-motion="1"] *::before, :root[data-reduce-motion="1"] *::after { animation: none !important; transition: none !important; }

/* ---------- buttons, chips, keys ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem; height: 2.25rem; padding: 0 1rem; border-radius: var(--r-s);
  background: rgba(255, 255, 255, .06); border: 1px solid var(--stroke); font-weight: 600; font-size: .8125rem; letter-spacing: .02em; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .08s, color .15s;
}
.btn:hover { background: rgba(255, 255, 255, .11); border-color: var(--stroke2); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.primary { background: linear-gradient(180deg, #ffc668, #e79d2e); color: #25190a; border-color: rgba(255, 220, 160, .6); box-shadow: 0 .25rem 1rem rgba(246, 180, 79, .22); }
.btn.primary:hover { background: linear-gradient(180deg, #ffd28a, #f0a93d); }
.btn.danger { background: rgba(255, 93, 108, .14); border-color: rgba(255, 93, 108, .4); color: #ffc2c8; }
.btn.danger:hover { background: rgba(255, 93, 108, .24); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: rgba(255, 255, 255, .07); }
.btn.sq { width: 2.25rem; padding: 0; }
.btn.sm { height: 1.875rem; padding: 0 .75rem; font-size: .75rem; }
.btn.on { background: rgba(246, 180, 79, .16); border-color: rgba(246, 180, 79, .55); color: var(--amber2); }
.chip {
  --c: #fff; position: relative; display: inline-flex; align-items: center; gap: .375rem; height: 1.5rem; padding: 0 .625rem; border-radius: 99rem; font-size: .75rem; font-weight: 600;
  color: var(--c); isolation: isolate;
}
.chip::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--c); opacity: .14; z-index: -1; }
.chip::after { content: ''; position: absolute; inset: 0; border-radius: inherit; border: 1px solid var(--c); opacity: .32; z-index: -1; }
.chip .ic { width: .95em; height: .95em; }
kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 1.35rem; height: 1.35rem; padding: 0 .3rem; font: 600 .6875rem var(--font-ui);
  background: rgba(255, 255, 255, .08); border: 1px solid var(--stroke2); border-bottom-width: 2px; border-radius: .3rem; color: var(--text);
}
:root[data-hints="0"] kbd.hint { display: none; }

/* ---------- bars ---------- */
.bar { --c: var(--good); position: relative; height: .375rem; border-radius: 99rem; background: rgba(255, 255, 255, .09); overflow: hidden; }
.bar > i { position: relative; display: block; height: 100%; width: 0; border-radius: inherit; background: var(--c); transition: width .45s var(--ease); }
.bar > i::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, rgba(0, 0, 0, .38), rgba(255, 255, 255, .12)); }
.bar.thick { height: .625rem; } .bar.thin { height: .25rem; }
.bar.warn > i { animation: pulse 1.2s infinite; }

/* ---------- segmented control / toggle / tabs ---------- */
.seg { display: inline-flex; padding: .1875rem; gap: .125rem; background: rgba(0, 0, 0, .3); border: 1px solid var(--stroke); border-radius: .625rem; }
.seg button { display: inline-flex; align-items: center; justify-content: center; gap: .375rem; height: 1.875rem; min-width: 1.875rem; padding: 0 .75rem; border: 0; background: transparent; border-radius: .45rem; color: var(--muted); font-weight: 600; font-size: .75rem; transition: background .15s, color .15s; }
.seg button:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
.seg button.on { background: rgba(246, 180, 79, .18); color: var(--amber2); box-shadow: inset 0 0 0 1px rgba(246, 180, 79, .4); }
.tgl { position: relative; width: 2.5rem; height: 1.375rem; border-radius: 99rem; border: 1px solid var(--stroke2); background: rgba(255, 255, 255, .08); padding: 0; transition: background .2s; }
.tgl i { position: absolute; top: .125rem; left: .125rem; width: 1rem; height: 1rem; border-radius: 50%; background: #cfd8e8; transition: transform .2s var(--ease), background .2s; }
.tgl.on { background: rgba(246, 180, 79, .35); border-color: rgba(246, 180, 79, .6); }
.tgl.on i { transform: translateX(1.125rem); background: var(--amber2); }
input[type=range] { -webkit-appearance: none; appearance: none; height: .375rem; border-radius: 99rem; background: rgba(255, 255, 255, .14); width: 100%; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 1rem; height: 1rem; border-radius: 50%; background: var(--amber2); border: .125rem solid #3a2610; box-shadow: 0 0 .5rem rgba(246, 180, 79, .5); }
input[type=text], input[type=number], select { height: 2.25rem; padding: 0 .75rem; border-radius: var(--r-s); border: 1px solid var(--stroke2); background: rgba(0, 0, 0, .35); color: var(--text); font: inherit; font-size: .8125rem; user-select: text; }

/* ---------- tooltip + context menu ---------- */
#tip, #ctx { position: fixed; left: 0; top: 0; z-index: 90; }
#tip { pointer-events: none; max-width: 24rem; padding: .625rem .8rem; border-radius: .6rem; background: rgba(8, 11, 18, .96); border: 1px solid var(--stroke2); box-shadow: var(--shadow); font-size: .8125rem; line-height: 1.45; }
#tip b { color: var(--amber2); font-weight: 600; }
#tip .tt-h { font-family: var(--font-display); font-size: 1.125rem; font-weight: 600; letter-spacing: .03em; margin-bottom: .25rem; }
#tip .tt-r { display: flex; justify-content: space-between; gap: 1.5rem; color: var(--muted); }
#tip .tt-r span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
#ctx { min-width: 12rem; padding: .3rem; border-radius: .7rem; background: rgba(10, 14, 22, .97); border: 1px solid var(--stroke2); box-shadow: var(--shadow); }
.ctx-i { display: flex; width: 100%; align-items: center; gap: .6rem; height: 2rem; padding: 0 .65rem; border: 0; border-radius: .45rem; background: transparent; text-align: left; font-size: .8125rem; }
.ctx-i span { flex: 1; }
.ctx-i:hover, .ctx-i:focus-visible { background: rgba(255, 255, 255, .09); }
.ctx-i[disabled] { opacity: .4; pointer-events: none; }
.ctx-i .ic { color: var(--amber); }
#ctx .sep { margin: .25rem 0; }

#vignette { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s; z-index: 1;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(255, 40, 60, .0) 70%, rgba(255, 40, 60, .38) 100%); }
#vignette.on { opacity: 1; animation: pulse 1.8s infinite; }
#vignette.low { background: radial-gradient(ellipse at center, transparent 50%, rgba(120, 0, 10, .55) 100%); }
#preview-badge { position: absolute; left: 50%; bottom: .3rem; transform: translateX(-50%); z-index: 70; padding: .2rem .8rem; border-radius: 99rem; font-size: .6875rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  background: rgba(10, 14, 22, .72); border: 1px solid rgba(246, 180, 79, .4); color: var(--amber2); pointer-events: none; }
</style>
<style>
/* Survival HUD: vitals (bottom-left), compass (top-centre), clock + weather (top-right), threat alert (right), key hints (bottom-centre). */
#hud { position: absolute; inset: 0; pointer-events: none; opacity: var(--hud-opacity); z-index: 5; transition: opacity .3s; }
:root[data-mode="colony"] #hud { display: none; }
:root[data-screen]:not([data-screen=""]) #hud .hints { display: none; }
/* the inventory panel covers the vitals corner: fade them out instead of leaving half a gauge showing */
:root[data-screen="inventory"] #hud .vitals { opacity: 0; transform: translateX(-1rem); animation: none; transition: opacity .2s, transform .2s; }

/* ----- vitals ----- */
#hud .vitals { position: absolute; left: 1.75rem; bottom: 1.75rem; width: 21rem; padding: 1rem 1.125rem 1rem; display: flex; flex-direction: column; gap: .875rem; animation: rise .5s var(--ease) both; }
.hp-row { display: grid; grid-template-columns: 2.5rem 1fr; gap: .75rem; align-items: center; }
.hp-ico { width: 2.5rem; height: 2.5rem; border-radius: .7rem; display: grid; place-items: center; color: var(--hp); background: rgba(255, 93, 108, .12); box-shadow: inset 0 0 0 1px rgba(255, 93, 108, .32); }
.hp-ico .ic { width: 1.4rem; height: 1.4rem; }
.hp-ico.crit { animation: pulse .9s infinite; }
.hp-top { display: flex; align-items: baseline; gap: .4rem; margin-bottom: .35rem; }
.hp-top .disp { font-size: 2rem; line-height: .9; letter-spacing: 0; }
.hp-top .of { color: var(--dim); font-size: .8125rem; }
.hp-top .lbl { margin-left: auto; }
#hud .vitals .bar { --c: var(--hp); height: .5rem; }
.gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.gauge { position: relative; display: flex; flex-direction: column; align-items: center; gap: .25rem; }
.gauge svg.ring { width: 3.75rem; height: 3.75rem; transform: rotate(-90deg); overflow: visible; }
.gauge circle { fill: none; stroke-width: 3.6; stroke-linecap: round; }
.gauge .trk { stroke: rgba(255, 255, 255, .09); }
.gauge .val { stroke: var(--c); stroke-dasharray: 113.1; stroke-dashoffset: 113.1; transition: stroke-dashoffset .6s var(--ease), stroke .3s; filter: drop-shadow(0 0 .25rem var(--c)); }
.gauge .gi { position: absolute; top: 1.2rem; left: 50%; transform: translateX(-50%); color: var(--c); display: grid; place-items: center; }
.gauge .gi .ic { width: 1.35rem; height: 1.35rem; }
.gauge .gv { font-family: var(--font-display); font-weight: 600; font-size: 1.125rem; line-height: 1; }
.gauge .gl { font-size: .625rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: -.1rem; }
.gauge.low .val { stroke: var(--warn); } .gauge.low .gi { color: var(--warn); }
.gauge.crit .val { stroke: var(--bad); animation: pulse .9s infinite; } .gauge.crit .gi { color: var(--bad); }
.status-row { display: flex; flex-wrap: wrap; gap: .4rem; }
.wt { display: grid; grid-template-columns: 1.25rem 1fr auto; gap: .6rem; align-items: center; font-size: .75rem; color: var(--muted); }
.wt .bar { --c: var(--weight); height: .3125rem; }
.wt.heavy .bar { --c: var(--warn); } .wt.over .bar { --c: var(--bad); }
.wt .num { color: var(--text); font-weight: 600; }

/* ----- compass ----- */
#hud .compass { position: absolute; top: 1.25rem; left: 50%; transform: translateX(-50%); width: 30rem; height: 3rem; padding: 0; overflow: hidden; border-radius: 99rem; animation: rise .5s var(--ease) both; }
#hud .compass canvas { width: 100%; height: 100%; display: block; }
#hud .compass .deg { position: absolute; left: 50%; top: -.05rem; transform: translateX(-50%); font: 700 .6875rem var(--font-ui); color: var(--amber2); letter-spacing: .08em; }

/* ----- clock ----- */
#hud .clock { position: absolute; top: 1.25rem; right: 1.75rem; min-width: 15rem; padding: .75rem 1.125rem; display: grid; grid-template-columns: auto 1fr; gap: .25rem .875rem; align-items: center; animation: rise .5s var(--ease) both; }
.clock .sun { grid-row: 1 / 3; width: 2.75rem; height: 2.75rem; border-radius: 50%; display: grid; place-items: center; color: var(--amber2); background: rgba(246, 180, 79, .12); box-shadow: inset 0 0 0 1px rgba(246, 180, 79, .3); }
.clock .sun.night { color: #b9c6ff; background: rgba(120, 140, 255, .12); box-shadow: inset 0 0 0 1px rgba(150, 165, 255, .3); }
.clock .sun .ic { width: 1.5rem; height: 1.5rem; }
.clock .time { font-family: var(--font-display); font-weight: 600; font-size: 2.25rem; line-height: .95; letter-spacing: .02em; }
.clock .meta { display: flex; align-items: center; gap: .6rem; font-size: .6875rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.clock .meta .ic { width: 1rem; height: 1rem; }
.clock .meta .off { color: var(--bad); }
.clock .meta .ok { color: var(--good); }

/* ----- colony chip (top-left) ----- */
#hud .colony-chip { position: absolute; top: 1.25rem; left: 1.75rem; display: flex; align-items: center; gap: .75rem; padding: .5rem 1rem .5rem .75rem; animation: rise .5s var(--ease) both; }
.colony-chip .ic { color: var(--amber); width: 1.4rem; height: 1.4rem; }
.colony-chip .big { font-family: var(--font-display); font-weight: 600; font-size: 1.375rem; line-height: 1; }
.colony-chip small { display: block; font-size: .625rem; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* ----- threat ----- */
#hud .threat { position: absolute; top: 7.25rem; right: 1.75rem; width: 15rem; padding: .875rem 1rem; display: flex; flex-direction: column; gap: .6rem; transition: opacity .4s, transform .4s var(--ease); }
#hud .threat.idle { opacity: 0; transform: translateX(1rem); }
#hud .threat .th-h { display: flex; align-items: center; gap: .5rem; }
#hud .threat .th-h .ic { color: var(--c, var(--warn)); width: 1.25rem; height: 1.25rem; }
#hud .threat .lvl { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: .06em; text-transform: uppercase; color: var(--c, var(--warn)); line-height: 1; margin-left: auto; }
.segbar { display: grid; grid-template-columns: repeat(10, 1fr); gap: .1875rem; }
.segbar i { height: .5rem; border-radius: .15rem; background: rgba(255, 255, 255, .09); transition: background .3s; }
.segbar i.on { background: var(--c, var(--warn)); box-shadow: 0 0 .5rem var(--c, var(--warn)); }
#hud .threat .near { display: flex; align-items: center; gap: .6rem; font-size: .8125rem; }
#hud .threat .near .arrow { width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .07); color: var(--c, var(--warn)); }
#hud .threat .near .arrow svg { width: 1rem; height: 1rem; transition: transform .3s; }
#hud .threat.t-low { --c: var(--info); } #hud .threat.t-elevated { --c: var(--warn); } #hud .threat.t-high { --c: #ff7a3d; } #hud .threat.t-critical { --c: var(--bad); animation: glow 1.4s infinite; }

/* ----- hints ----- */
#hud .hints { position: absolute; left: 50%; bottom: 2.2rem; transform: translateX(-50%); display: flex; gap: 1.25rem; padding: .5rem 1rem; font-size: .75rem; color: var(--muted); border-radius: 99rem; }
#hud .hints span { display: inline-flex; align-items: center; gap: .4rem; }
</style>
<style>
/* Colony mode chrome: top bar, roster, dock, command bar, minimap. Layout is in rem so it scales 1080p -> 4K. */
#colony { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
#colony > * { pointer-events: auto; }
#mapbg { position: absolute; inset: 0; z-index: 0; }
#mapbg.layer { background: transparent; }
#mapbg .selbox { position: fixed; z-index: 3; pointer-events: none; border: 1px solid var(--amber); background: rgba(246, 180, 79, .16); border-radius: 2px; }
#mapbg .map-cv { position: absolute; inset: 0; display: block; }

<body>
<!-- Outbreak NUI. Vanilla HTML/CSS/JS, no CDN, no build step. Scripts talk to the game only through OB.post() / window "message" events
     (see js/core.js). In the browser preview the same page runs inside preview/index.html with a fake bridge. -->
<div id="app">
  <div id="vignette" aria-hidden="true"></div>
  <div id="preview-badge" hidden>PREVIEW &middot; no GTA &middot; live Lua sim</div>

  <!-- survival HUD -->
  <section id="hud" aria-label="Survival HUD"></section>

  <!-- colony mode chrome -->
  <section id="colony" aria-label="Colony view" hidden>
    <div id="mapbg" hidden></div>
    <header id="topbar"></header>
    <aside id="roster"></aside>
    <aside id="dock"></aside>
    <nav id="cmdbar" aria-label="Commands"></nav>
    <div id="minimap"></div>
  </section>

  <!-- modal screens -->
  <div id="screens"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="tip" role="tooltip" hidden></div>
  <div id="ctx" hidden></div>
  <div id="dragghost" hidden></div>
</div>

<script>
/* phone-bridge.js : the host contract of the UNCHANGED Outbreak page (copied from fivem/outbreak/ui by mta/tools/sync_ui.sh), implemented over HTTP polling, so a PHONE BROWSER can show and
   steer the colony of a real MTA:SA server with no GTA client. Loaded by ui/phone.html BEFORE js/core.js (like mta-bridge.js is by mta.html). It speaks to the one function the resource
   exports over HTTP (server/phone.lua phoneApi, reached through MTA's call interface: POST /<resource>/call/phoneApi with a JSON array body).

   page -> game : the page calls  fetch('https://outbreak/<callback>', { method: 'POST', body: JSON })  (js/core.js OB.post). window.fetch is wrapped: order, ui and place(commit) become
                      phoneApi("cb", sid, name, data)
                  in order, one request at a time; ready starts the handshake; the in-game client's camera / window callbacks (mode, screen, focus, mouse, key, close, place start / cancel and
                  the ui actions "screens") have no meaning for a phone and are answered locally.
   game -> page : phoneApi("ready", sid) returns the first messages (boot, mode, catalog, state), phoneApi("poll", sid, seq, gen) the ones since; each message is {action, data}, dispatched
                  as window.dispatchEvent(new MessageEvent('message', {data})), which is what js/main.js listens for. MTA's call interface answers synchronously (a request cannot be held
                  open), so this polls: about every 500 ms while the page is visible, every 5 s while hidden, with back-off after errors, and at once after a callback.
   MTA wraps the string phoneApi returns into a JSON array: the body is ["<json text>"]. A 401 means the login is missing or has no right: reload the page to be asked again.
   window.__phone exposes the connection state for the tests and the dev tools. No CDN, no network except the page's own server. */
(function () {
  'use strict';
  var RESOURCE = 'outbreak';
  var URL_RE = /^https?:\/\/([^\/?#]+)\/([A-Za-z0-9_\-]+)\/?(?:[?#].*)?$/;
  var m = /^\/([^\/]+)\//.exec(location.pathname);
  var API = '/' + (m ? m[1] : RESOURCE) + '/call/phoneApi';
  var nativeFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;
  var LOCAL = { mode: 1, screen: 1, focus: 1, mouse: 1, key: 1, close: 1 }; // the in-game client's camera and window business
  var FAST = 500, SLOW = 5000, TIMEOUT = 9000;

  function newSid() {
    try { var s = sessionStorage.getItem('outbreak.phone.sid'); if (s && /^[A-Za-z0-9_\-]{8,40}$/.test(s)) return s; } catch (e) { /* storage blocked */ }
    var a = '';
    try { var u = new Uint8Array(16); crypto.getRandomValues(u); for (var i = 0; i < u.length; i++) a += (u[i] < 16 ? '0' : '') + u[i].toString(16); } catch (e) { for (var j = 0; j < 32; j++) a += Math.floor(Math.random() * 16).toString(16); }
    try { sessionStorage.setItem('outbreak.phone.sid', a); } catch (e) { /* storage blocked */ }
    return a;
  }
  var st = window.__phone = { sid: newSid(), api: API, ready: false, connected: false, role: null, seq: 0, gen: 0, polls: 0, posts: 0, resyncs: 0, errors: 0, failStreak: 0, lastError: '', authFailed: false, hidden: false, queue: 0, lastStatus: null };
  window.GetParentResourceName = function () { return RESOURCE; };

  function dispatch(msg) { try { window.dispatchEvent(new MessageEvent('message', { data: msg })); } catch (e) { if (window.console) console.error('[phone-bridge] message failed', e); } }
  function toast(level, text) { dispatch({ action: 'toast', data: { level: level, text: text } }); }
  var lastToast = {};
  function toastOnce(key, level, text, ms) { var now = Date.now(); if (lastToast[key] && now - lastToast[key] < (ms || 6000)) return; lastToast[key] = now; toast(level, text); }
  function badge(text, warn) {
    var b = document.getElementById('preview-badge'); if (!b) return;
    b.textContent = text; b.hidden = false; b.style.color = warn ? '#ff9aa4' : ''; b.style.borderColor = warn ? 'rgba(255,93,108,.55)' : '';
  }

  // one request to phoneApi: resolves { ok, ... } (the decoded answer) or rejects with an Error (network, HTTP status, bad body)
  function call(op, a, b) {
    var body = JSON.stringify([op, st.sid, a === undefined ? null : a, b === undefined ? null : b]);
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, TIMEOUT) : 0;
    st.posts++;
    return nativeFetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Outbreak-Phone': '1' }, body: body, cache: 'no-store', credentials: 'same-origin', signal: ctl ? ctl.signal : undefined })
      .then(function (r) {
        clearTimeout(timer);
        if (r.status === 401 || r.status === 403) { st.authFailed = true; var e = new Error('HTTP ' + r.status + ' (login required or not allowed)'); e.auth = true; throw e; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (t) {
        var arr;
        try { arr = JSON.parse(t); } catch (e) { throw new Error('not JSON: ' + String(t).slice(0, 60)); }
        var inner = Array.isArray(arr) ? arr[0] : arr;
        if (typeof inner === 'string') { try { inner = JSON.parse(inner); } catch (e) { throw new Error('bad answer: ' + inner.slice(0, 60)); } }
        if (!inner || typeof inner !== 'object') throw new Error('empty answer');
        return inner;
      }, function (e) { clearTimeout(timer); throw e; });
  }

  function accept(r) { // apply the bookkeeping + the messages of a successful answer
    if (r.seq !== undefined) st.seq = r.seq;
    if (r.gen !== undefined) st.gen = r.gen;
    if (r.role) st.role = r.role;
    if (r.status) st.lastStatus = r.status;
    if (r.msgs) for (var i = 0; i < r.msgs.length; i++) {
      var msg = r.msgs[i];
      if (msg && msg.action === 'boot' && msg.data) { st.account = msg.data.account; st.role = msg.data.role || st.role; }
      dispatch(msg);
    }
  }
  function setConnected(on) {
    if (on === st.connected) return;
    st.connected = on;
    if (on) { badge('LIVE · MTA SERVER', false); if (st.wasLost) toast('good', 'Reconnected to the server.'); st.wasLost = false; }
    else { st.wasLost = true; badge('OFFLINE · RETRYING', true); toastOnce('lost', 'warn', 'Connection to the server lost. Retrying...'); }
  }

  var timer = 0, busy = false, kick = false;
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(tick, ms); }
  function delay() { if (st.failStreak) return Math.min(8000, FAST * Math.pow(2, st.failStreak)); return document.hidden ? SLOW : FAST; }
  function tick() {
    if (busy || st.authFailed) return;
    busy = true;
    var p = st.ready ? call('poll', st.seq, st.gen).then(function (r) {
      st.polls++;
      if (r.resync) { st.ready = false; st.resyncs++; kick = true; return; }
      if (r.ok === false) throw new Error(r.error || 'refused');
      accept(r); st.failStreak = 0; setConnected(true);
    }) : call('ready').then(function (r) {
      if (r.ok === false) throw new Error(r.error || 'refused');
      accept(r); st.ready = true; st.failStreak = 0; setConnected(true); flushQueue();
    });
    p.then(function () { busy = false; schedule(kick ? 0 : delay()); kick = false; }, function (e) {
      busy = false; st.errors++; st.lastError = String(e && e.message || e); st.failStreak++; if (e.auth) st.ready = false;
      if (e.auth) { setConnected(false); badge('LOGIN REQUIRED', true); toastOnce('auth', 'bad', 'The server refused the login. Reload this page to sign in again.', 60000); return; }
      if (st.failStreak >= 2) setConnected(false);
      schedule(delay());
    });
  }

  // ---- callbacks (page -> server): serial, in order
  var chain = Promise.resolve(), pending = [];
  function flushQueue() { var q = pending; pending = []; for (var i = 0; i < q.length; i++) send(q[i][0], q[i][1]); }
  function send(name, data) {
    st.queue++;
    chain = chain.then(function () {
      return call('cb', name, data).then(function (r) {
        st.queue--;
        if (r.resync) { st.ready = false; st.resyncs++; pending.push([name, data]); schedule(0); return; } // the server forgot this page (expired / evicted / restarted): sign in again, then send it
        if (r.ok === false) {
          if (r.error === 'read-only') toastOnce('ro', 'warn', 'This login is read-only: you can look at the colony but not change it.');
          else if (/rate/.test(r.error || '')) toastOnce('rate', 'warn', 'Too many commands at once, slow down.', 3000);
          else toastOnce('cb:' + r.error, 'warn', 'The server refused that: ' + r.error);
          return;
        }
        accept(r);
        schedule(120); // the sim answers an order with events (order_result): fetch them soon
      }, function (e) { st.queue--; st.errors++; st.lastError = String(e && e.message || e); if (e.auth) { st.authFailed = true; badge('LOGIN REQUIRED', true); } else toastOnce('cbfail', 'warn', 'Could not reach the server. That command was lost.'); });
    });
  }
  function onCallback(name, data) {
    if (LOCAL[name]) return;
    if (name === 'place' && data && data.op !== 'commit') return;
    if (name === 'ui' && data && data.name === 'screens') return;
    if (name === 'ready') { if (!st.ready) { schedule(0); } return; }
    if (name !== 'order' && name !== 'ui' && name !== 'place') return;
    if (!st.ready) { pending.push([name, data]); return; }
    send(name, data);
  }

  function reply(obj) {
    var body = JSON.stringify(obj);
    if (typeof Response === 'function') return Promise.resolve(new Response(body, { status: 200, headers: { 'Content-Type': 'application/json' } }));
    return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(obj); }, text: function () { return Promise.resolve(body); } });
  }
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var mm = URL_RE.exec(url);
    if (!mm || mm[1] !== RESOURCE) {
      if (nativeFetch) return nativeFetch(input, init);
      return Promise.reject(new TypeError('fetch is not available in this browser'));
    }
    var data = {};
    try { data = init && typeof init.body === 'string' ? JSON.parse(init.body) : {}; } catch (e) { data = {}; }
    onCallback(mm[2], data);
    return reply({ ok: true });
  };

  document.addEventListener('visibilitychange', function () { st.hidden = document.hidden; if (!document.hidden && st.ready) schedule(0); });
  window.addEventListener('online', function () { st.failStreak = 0; schedule(0); });
  // the page's own init posts `ready` (after every script has run), which starts the handshake; `load` is the fallback. Starting earlier could lose the first messages: the page's
  // message listener does not exist until js/main.js has run.
  window.addEventListener('load', function () { if (!st.ready && !busy) schedule(0); });
})();
</script>
<script>
/* Outbreak NUI core: DOM helpers, formatters, store, event bus, game bridge, tooltip + context menu, settings.
   Everything hangs off window.OB (classic scripts, no modules: works in FiveM's CEF and in the browser preview alike). */
(function () {
  'use strict';
  const OB = (window.OB = { v: 1, mods: {} });

  // ---------------------------------------------------------------------------------------------------------------- DOM
  OB.$ = (sel, root) => (root || document).querySelector(sel);
  OB.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  // h('div.cls#id', { class, text, html, style:{}, on:{click}, attrs:{}, dataset:{} }, ...children)
  OB.h = function h(tag, props, ...kids) {
    const m = /^([a-z0-9-]*)((?:[.#][\w:-]+)*)$/i.exec(tag) || [null, 'div', ''];
    const el = document.createElement(m[1] || 'div');
    const cls = [];
    (m[2].match(/[.#][\w:-]+/g) || []).forEach(t => (t[0] === '.' ? cls.push(t.slice(1)) : (el.id = t.slice(1))));
    if (props != null && props !== false && (props.nodeType || typeof props === 'string' || typeof props === 'number' || Array.isArray(props))) { kids.unshift(props); props = null; } // (a number as the first child, e.g. h('b', 3), is text, not a props object)
    if (props) {
      if (props.class) cls.push(props.class);
      for (const k of Object.keys(props)) {
        const v = props[k];
        if (k === 'class' || v == null || v === false) continue;
        if (k === 'text') el.textContent = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'style') { for (const sk of Object.keys(v)) { if (sk.charAt(0) === '-') el.style.setProperty(sk, v[sk]); else el.style[sk] = v[sk]; } }
        else if (k === 'on') for (const ev of Object.keys(v)) el.addEventListener(ev, v[ev]);
        else if (k === 'attrs') for (const a of Object.keys(v)) el.setAttribute(a, v[a]);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k in el && k !== 'list') el[k] = v;
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    if (cls.length) el.className = cls.join(' ');
    for (const k of kids.flat(3)) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
    return el;
  };
  OB.clear = el => { while (el.firstChild) el.removeChild(el.firstChild); return el; };
  OB.setText = (el, text) => { text = String(text); if (el._t !== text) { el._t = text; el.textContent = text; } };
  OB.setAttr = (el, k, v) => { v = String(v); const key = '_a_' + k; if (el[key] !== v) { el[key] = v; el.setAttribute(k, v); } };
  OB.setStyle = (el, k, v) => { const key = '_s_' + k; if (el[key] !== v) { el[key] = v; el.style.setProperty(k, v); } };
  OB.toggle = (el, cls, on) => { on = !!on; const key = '_c_' + cls; if (el[key] !== on) { el[key] = on; el.classList.toggle(cls, on); } };
  OB.show = (el, on) => { on = !!on; if (el._show !== on) { el._show = on; el.toggleAttribute('hidden', !on); } };

  // keyed child reconciliation: keeps DOM nodes alive between updates (cheap updates, preserved hover/focus/scroll)
  OB.reconcile = function (parent, list, keyFn, make, update) {
    const old = parent._keyed || (parent._keyed = new Map());
    const next = new Map();
    let prev = null;
    for (const item of list) {
      const k = keyFn(item);
      let el = old.get(k);
      if (!el) el = make(item);
      else old.delete(k);
      update(el, item);
      next.set(k, el);
      const want = prev ? prev.nextSibling : parent.firstChild;
      if (want !== el) parent.insertBefore(el, want);
      prev = el;
    }
    for (const el of old.values()) el.remove();
    parent._keyed = next;
  };

  // ------------------------------------------------------------------------------------------------------------ format
  const F = (OB.fmt = {});
  F.n = (x, d) => (x == null || isNaN(x) ? '-' : Number(x).toLocaleString('en-US', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }));
  F.kg = g => (g >= 1000 ? (g / 1000).toFixed(g >= 10000 ? 0 : 1) + ' kg' : Math.round(g) + ' g');
  F.pct = x => Math.round(x) + '%';
  F.cap = s => (s ? s.charAt(0).toUpperCase() + s.slice(1) : '');
  F.dur = min => {
    min = Math.max(0, Math.round(min));
    if (min < 60) return min + 'm';
    const h = Math.floor(min / 60);
    if (h < 24) return h + 'h ' + String(min % 60).padStart(2, '0') + 'm';
    return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
  };

  };

  // In FiveM: fetch('https://<resource>/<callback>') is how a NUI page calls RegisterNUICallback handlers. In the browser preview the
  // page is an iframe of preview/index.html and the shell exposes window.parent.__previewBridge instead.

  OB.resource = typeof window.GetParentResourceName === 'function' ? window.GetParentResourceName() : 'outbreak';
  OB.post = function (name, data) {

    }

      method: 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: JSON.stringify(data || {}),
    }).catch(() => {});

  // ---------------------------------------------------------------------------------------------------------- settings
  const DEF = { uiScale: 1, reduceMotion: false, colorblind: false, hudOpacity: 1, compass: true, hints: true };
  OB.settings = Object.assign({}, DEF);
  try { Object.assign(OB.settings, JSON.parse(localStorage.getItem('outbreak.settings') || '{}')); } catch (e) { /* storage may be blocked */ }
  OB.applySettings = function () {
    const s = OB.settings, r = document.documentElement;
    r.style.setProperty('--ui-scale', String(OB.clamp(+s.uiScale || 1, 0.6, 1.8)));
    r.style.setProperty('--hud-opacity', String(OB.clamp(+s.hudOpacity || 1, 0.3, 1)));
    r.dataset.reduceMotion = s.reduceMotion ? '1' : '0';
    r.dataset.cb = s.colorblind ? '1' : '0';
    r.dataset.hints = s.hints ? '1' : '0';
  };

  };

  OB.item = id => (OB.S.catalog && OB.S.catalog.items[id]) || { name: F.snake(id), cat: 'material', w: 0, stack: 1, value: 0 };

  OB.short = name => String(name || '').replace(/\s*".*"\s*$/, '');
  OB.nick = name => { const m = /"([^"]+)"/.exec(name || ''); return m ? m[1] : OB.short(name); };

    structure: '#9aa7bd', defense: '#ff7a7a', furniture: '#d7a36e', production: '#f6b44f', power: '#f6d04d', storage: '#7aa7ff', water: '#47c7f5', utility: '#7ee0c3',
  };

    if (t + h > H - pad) t = Math.max(pad, y - h - 14);

      clearTimeout(tipTimer);
      tipTimer = setTimeout(() => open(e.clientX, e.clientY), delay == null ? 250 : delay);
    });

    }

  // One modal screen at a time (inventory, priorities, map, menu, summary ...). Modules register { build(), onOpen(arg), onClose(), update(state) }.
  OB.screens = (function () {
    const reg = {}; let cur = null, host = null;
    function mount() { host = host || OB.$('#screens'); return host; }
    const api = {
      reg(name, def) { reg[name] = def; },
      get current() { return cur; },
      open(name, arg) {
        const def = reg[name]; if (!def) return false;
        if (cur && cur !== name) api.close(true);
        mount();
        if (!def.el) {
          def.el = OB.h('div.scrim', { dataset: { screen: name }, on: { pointerdown: e => { if (e.target === def.el && !def.sticky) api.close(); } } }, def.build());
          host.append(def.el);
        }
        def.el.hidden = false;
        cur = name;
        document.documentElement.dataset.screen = name;
        if (def.onOpen) def.onOpen(arg);
        if (def.update && OB.S.state) def.update(OB.S.state);
        OB.post('screen', { name, open: true });
        OB.emit('screen', name);
        return true;
      },
      close(silent) {
        if (!cur) return;
        const def = reg[cur], name = cur;
        def.el.hidden = true;
        if (def.onClose) def.onClose();
        cur = null;
        document.documentElement.dataset.screen = '';
        OB.hideTip(); OB.closeCtx();
        if (!silent) { OB.post('screen', { name, open: false }); OB.emit('screen', null); }
      },
      toggle(name, arg) { if (cur === name) api.close(); else api.open(name, arg); },
      update(state) { if (cur && reg[cur].update) reg[cur].update(state); },
      has: name => !!reg[name],
    };
    return api;
  })();

  // small reusable widgets -----------------------------------------------------------------------------------------
  // bar(color) -> element with .setValue(pct)
  OB.bar = function (cls) {
    const fill = OB.h('i');
    const el = OB.h('div.bar' + (cls ? '.' + cls : ''), fill);

    el.set = function (pct, color) {

    const el = OB.h('div.seg' + (cls ? '.' + cls : ''), { role: 'group' });

    el.set = v => OB.$$('button', el).forEach(b => { const on = b.dataset.value === String(v); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    return el;
  };

    return b;
  };
  OB.key = k => OB.h('kbd', k);
})();
</script>

    wave: '<path d="M3 12c2-3.500 4-3.500 6 0s4 3.500 6 0 4-3.500 6 0"/>',
    helmet: '<path d="M5 14a7 7 0 0 1 14 0v2H5zM5 16v3h14v-3"/>',
    scope: '<circle cx="12" cy="12" r="7.500"/><path d="M12 2.500v5M12 16.500v5M2.500 12h5M16.500 12h5"/>',
    pin: '<path d="M12 21s6.500-6 6.500-11a6.500 6.500 0 0 0-13 0C5.500 15 12 21 12 21z"/><circle cx="12" cy="10" r="2.300"/>',
    run: '<circle cx="14.500" cy="5" r="2"/><path d="M9 20l2.500-5-2-2 1.500-4.500 4 .5 2.500 3.500M8 11l-3 2M15 17l-2-2.200"/>',
    mask: '<path d="M4 8c3-2 5.500-2.500 8-2.500s5 .5 8 2.500c0 5.500-2.200 9.500-8 11.500C6.200 17.500 4 13.500 4 8z"/><path d="M8 11.200h2M14 11.200h2M9.500 15.500h5"/>',
  };
  OB.iconNames = Object.keys(P);
  const NS = 'http://www.w3.org/2000/svg';
  const sprite = document.createElementNS(NS, 'svg');
  sprite.setAttribute('width', '0'); sprite.setAttribute('height', '0'); sprite.setAttribute('aria-hidden', 'true');
  sprite.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
  sprite.innerHTML = '<defs>' + Object.keys(P).map(k =>
    '<symbol id="i-' + k + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + P[k] + '</symbol>').join('') + '</defs>';
  document.body.prepend(sprite);

  OB.icon = function (name, cls) {
    if (!P[name]) name = 'info';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'ic' + (cls ? ' ' + cls : ''));
    svg.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS(NS, 'use');
    use.setAttribute('href', '#i-' + name);
    svg.appendChild(use);
    return svg;
  };

  // icon for an item id / blueprint / work type / job, by best match
  const ITEM_ICON = {
    water_bottle: 'bottle', soda_can: 'can', canned_beans: 'can', canned_veg: 'can', canned_fruit: 'can', bandage: 'bandage', first_aid_kit: 'cross', surgical_kit: 'cross',
    antibiotics: 'pill', painkillers: 'pill', baseball_bat: 'bat', crowbar: 'bat', machete: 'knife', pistol: 'gun', shotgun: 'gun', rifle: 'scope', fuel_can: 'fuel', firewood: 'fire',
    toolbox: 'wrench', jewelry: 'star', radio_set: 'radio', electronics: 'bolt', rice_bag: 'food', cooked_rice: 'pot', stew: 'pot', ration_pack: 'food', energy_bar: 'food',
    dried_meat: 'food', cloth_scrap: 'layers', scrap_wood: 'floor', scrap_metal: 'gear', nails: 'wrench', sandbag: 'weight', wire: 'wave', concrete_bag: 'weight', duct_tape: 'bandage',
  };
  const CAT_ICON = { food: 'food', drink: 'bottle', medical: 'cross', weapon: 'gun', ammo: 'ammo', material: 'gear', fuel: 'fuel', tool: 'wrench', valuable: 'star', ingredient: 'food',
    structure: 'floor', defense: 'shield', furniture: 'bed', production: 'fire', power: 'bolt', storage: 'crate', water: 'drop', utility: 'lamp' };
  OB.itemIcon = id => ITEM_ICON[id] || CAT_ICON[OB.item(id).cat] || 'crate';
  OB.catIcon = cat => CAT_ICON[cat] || 'crate';
  OB.bpIcon = id => ({ floor: 'floor', wall: 'wall', door: 'door', barricade: 'barricade', bed: 'bed', campfire: 'fire', workbench: 'wrench', stove: 'stove', generator: 'gen', watchtower: 'tower',
    crate: 'crate', rain_collector: 'rain', water_tank: 'tank', medical_bed: 'cross', lamp: 'lamp', radio_mast: 'radio' }[id] || 'crate');
  OB.workIcon = w => ({ doctor: 'cross', guard: 'shield', build: 'hammer', cook: 'pot', craft: 'wrench', haul: 'crate', scavenge: 'search' }[w] || 'gear');
  OB.jobIcon = j => ({ goto: 'run', haul: 'crate', deliver: 'crate', unload: 'crate', build: 'hammer', repair: 'hammer', cook: 'pot', craft: 'wrench', tend: 'cross', medicate: 'pill', amputate: 'cross',
    feed: 'food', guard: 'shield', scavenge: 'search', refuel: 'fuel', eat: 'food', drink: 'drop', sleep: 'zzz', rest: 'zzz', binge: 'food', wander: 'run', draft: 'swords', equip: 'gun', idle: 'person', away: 'truck', downed: 'heart' }[j] || 'person');
  OB.weatherIcon = k => (k === 'storm' ? 'storm' : k === 'rain' ? 'rain' : 'clear');

<script>
/* Survival HUD. borrowed: Paradigm-MP/fivem-rust-gamemode/inventory/src/js/SurvivalHUD.js (GPL-3.0, private use): the layout idea (vitals cluster, status
   chips, weight bar: icon + fill + number stat rows) re-done as radial gauges; compass strip and threat panel are original. */
(function () {
  'use strict';
  const OB = window.OB, h = OB.h;
  const C = 113.1; // circumference of the gauge ring (r = 18)

  const hud = (OB.hud = {});
  let el = {};
  let lastHeading = -1, lastMarks = '', cvs, ctx;

  function gauge(id, icon, label, color) {
    const ring = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    ring.setAttribute('viewBox', '0 0 44 44'); ring.setAttribute('class', 'ring');
    ring.innerHTML = '<circle class="trk" cx="22" cy="22" r="18"/><circle class="val" cx="22" cy="22" r="18"/>';
    const g = h('div.gauge', { dataset: { id }, style: { '--c': color } }, ring, h('div.gi', OB.icon(icon)), h('div.gv.num', '100'), h('div.gl', label));
    g.val = ring.querySelector('.val'); g.gv = g.querySelector('.gv');
    return g;
  }

  hud.init = function () {
    const root = OB.$('#hud');
    OB.clear(root);
    el.hpIco = h('div.hp-ico', OB.icon('heart'));
    el.hpNum = h('span.disp.num', '100');
    el.hpMax = h('span.of', '/ 100');
    el.hpBar = OB.bar('thick');
    el.bleed = h('span.chip.bad-chip', { style: { '--c': 'var(--bleed)' }, hidden: true }, OB.icon('bleed'), h('span', ''));
    el.inf = h('span.chip', { style: { '--c': 'var(--infect)' }, hidden: true }, OB.icon('bio'), h('span', ''));
    el.pain = h('span.chip', { style: { '--c': 'var(--warn)' }, hidden: true }, OB.icon('alert'), h('span', 'Pain'));
    el.down = h('span.chip', { style: { '--c': 'var(--bad)' }, hidden: true }, OB.icon('skull'), h('span', 'Down'));
    el.okc = h('span.chip', { style: { '--c': 'var(--good)' } }, OB.icon('check'), h('span', 'Stable'));
    el.gH = gauge('hunger', 'food', 'Food', 'var(--hunger)');
    el.gT = gauge('thirst', 'drop', 'Water', 'var(--thirst)');
    el.gF = gauge('fatigue', 'moon', 'Rest', 'var(--fatigue)');
    el.wtBar = OB.bar(); el.wtNum = h('span.num', '0 / 30 kg');
    el.wt = h('div.wt', OB.icon('weight'), el.wtBar, el.wtNum);
    el.vitals = h('div.vitals.panel',
      h('div.hp-row', el.hpIco, h('div', h('div.hp-top', el.hpNum, el.hpMax, h('span.lbl', 'Health')), el.hpBar)),
      h('div.gauges', el.gH, el.gT, el.gF),
      h('div.status-row', el.okc, el.bleed, el.inf, el.pain, el.down),
      el.wt);
    OB.tip(el.vitals, () => '<div class="tt-h">Survival</div><div class="tt-r"><span>Food drains</span><span>~2.6 meals / day</span></div><div class="tt-r"><span>Water drains</span><span>~12 h to empty</span></div><div class="tt-r"><span>Rest</span><span>~18 h awake</span></div><div class="tt-r"><span>Infection</span><span>hidden while incubating</span></div>');

    // compass
    cvs = h('canvas', { width: 900, height: 90 });
    ctx = cvs.getContext('2d');
    el.deg = h('span.deg', '000');
    el.compass = h('div.compass.panel', cvs, el.deg);

    // clock
    el.sun = h('div.sun', OB.icon('sun'));
    el.time = h('div.time.num', '08:00');
    el.date = h('span', 'Day 1');
    el.weather = h('span', OB.icon('clear'));
    el.pw = h('span.ok', OB.icon('bolt'));
    el.wa = h('span.ok', OB.icon('drop'));
    el.clock = h('div.clock.panel', el.sun, el.time, h('div.meta', el.date, el.weather, el.pw, el.wa));
    OB.tip(el.weather, () => OB.fmt.cap((OB.S.hud || {}).weather || 'clear') + ' weather', 100);
    OB.tip(el.pw, () => 'Power ' + (el.pw.classList.contains('off') ? '<b>offline</b>: lights out, no stoves or workbenches' : 'online'));
    OB.tip(el.wa, () => 'Water ' + (el.wa.classList.contains('off') ? '<b>offline</b>: colonists need bottles' : 'available'));

    // colony chip
    el.chipN = h('div.big.num', '0'); el.chipS = h('small', 'Colonists');
    el.colony = h('div.colony-chip.panel', OB.icon('home'), h('div', el.chipN, el.chipS));

    // threat
    el.thIco = OB.icon('radar'); el.thLvl = h('div.lvl', 'Quiet');
    el.thSeg = h('div.segbar', ...Array.from({ length: 10 }, () => h('i')));
    el.thArrow = h('div.arrow', OB.icon('up')); el.thTxt = h('div.grow', '');
    el.threat = h('div.threat.panel.idle', h('div.th-h', el.thIco, h('span.lbl', 'Threat'), el.thLvl), el.thSeg, h('div.near', el.thArrow, el.thTxt));

    // hints
    el.hints = h('div.hints.panel', h('span', OB.key('F6'), 'Colony view'), h('span', OB.key('I'), 'Inventory'), h('span', OB.key('Esc'), 'Menu'));

    root.append(el.colony, el.compass, el.clock, el.threat, el.vitals, el.hints);
    hud.compass(0, true);
  };

  function setGauge(g, need) {
    const left = OB.clamp(100 - need, 0, 100);
    g.val.style.strokeDashoffset = (C * (1 - left / 100)).toFixed(2);
    OB.setText(g.gv, Math.round(left));
    OB.toggle(g, 'low', left < 35 && left >= 15);
    OB.toggle(g, 'crit', left < 15);
  }

  hud.update = function (d) {
    if (!el.vitals || !d) return;
    OB.setText(el.hpNum, Math.round(d.hp));
    OB.setText(el.hpMax, '/ ' + d.hp_max);
    el.hpBar.set(d.hp / d.hp_max * 100);
    OB.toggle(el.hpIco, 'crit', d.hp / d.hp_max < 0.25);
    OB.toggle(el.hpBar, 'warn', d.hp / d.hp_max < 0.25);
    setGauge(el.gH, d.hunger); setGauge(el.gT, d.thirst); setGauge(el.gF, d.fatigue);
    OB.show(el.bleed, d.bleeding > 0.02); OB.setText(el.bleed.lastChild, 'Bleeding ' + d.bleeding.toFixed(2) + '/min');
    OB.show(el.inf, d.infection !== 'none'); OB.setText(el.inf.lastChild, d.infection === 'terminal' ? 'Infection: terminal' : 'Infection: symptoms');
    OB.show(el.pain, d.pain >= 25);
    OB.show(el.down, !!d.downed);
    OB.show(el.okc, !(d.bleeding > 0.02 || d.infection !== 'none' || d.pain >= 25 || d.downed));
    const frac = d.weight_max > 0 ? d.weight / d.weight_max : 0;
    el.wtBar.set(frac * 100);
    OB.toggle(el.wt, 'heavy', frac >= 0.75 && frac < 1); OB.toggle(el.wt, 'over', frac >= 1);
    OB.setText(el.wtNum, d.weight.toFixed(1) + ' / ' + d.weight_max.toFixed(0) + ' kg');

    OB.setText(el.time, d.clock);
    if (el.sun._k !== !!d.night) { el.sun._k = !!d.night; el.sun.classList.toggle('night', !!d.night); el.sun.replaceChildren(OB.icon(d.night ? 'moon' : 'sun')); }
    OB.setText(el.date, 'Day ' + d.day + ' · ' + OB.fmt.cap(d.season));
    if (el.weather._k !== d.weather) { el.weather._k = d.weather; el.weather.replaceChildren(OB.icon(OB.weatherIcon(d.weather))); }
    OB.toggle(el.pw, 'off', !d.power_ok); OB.toggle(el.pw, 'ok', d.power_ok);
    OB.toggle(el.wa, 'off', !d.water_ok); OB.toggle(el.wa, 'ok', d.water_ok);
    OB.setText(el.chipN, d.colonists);

    // threat panel
    const t = d.threat || { level: 0, label: 'Quiet' };
    const idle = t.level <= 0.05 && !d.alert;
    OB.toggle(el.threat, 'idle', idle);
    ['low', 'elevated', 'high', 'critical'].forEach(k => OB.toggle(el.threat, 't-' + k, t.label.toLowerCase() === k));
    OB.setText(el.thLvl, d.alert && t.level < 0.35 ? 'Alert' : t.label);
    const on = Math.round(t.level * 10);
    Array.from(el.thSeg.children).forEach((s, i) => OB.toggle(s, 'on', i < on || (d.alert && i < 3)));
    if (t.nearest) {
      const n = t.nearest;
      OB.setText(el.thTxt, (n.kind === 'raid' ? (n.name || 'Raiders') + ' · ' + n.size : 'Horde · ' + n.size) + ' — ' + OB.fmt.dist(n.dist) + ' ' + OB.fmt.dir(n.bearing));
      el.thArrow.firstChild.style.transform = 'rotate(' + Math.round(n.bearing - OB.S.compass) + 'deg)';
    } else OB.setText(el.thTxt, d.alert ? 'Base alert: movement detected' : 'No contacts');
    const low = d.hp / d.hp_max < 0.3, alert = t.level >= 0.6;
    const v = OB.$('#vignette');
    v.classList.toggle('on', low || alert);
    v.classList.toggle('low', low);
    hud.compass(OB.S.compass, false, d);
  };

  // compass strip (canvas): heading in degrees, markers for the base and the nearest threat
  hud.compass = function (heading, force, d) {
    if (!cvs) return;
    d = d || OB.S.hud || {};
    const marks = JSON.stringify([d.base_bearing, d.threat && d.threat.nearest && d.threat.nearest.bearing]);
    heading = ((heading % 360) + 360) % 360;
    if (!force && Math.abs(heading - lastHeading) < 0.4 && marks === lastMarks) return;
    lastHeading = heading; lastMarks = marks;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const W = Math.round(cvs.clientWidth * dpr) || 900, H = Math.round(cvs.clientHeight * dpr) || 90;
    if (cvs.width !== W || cvs.height !== H) { cvs.width = W; cvs.height = H; }
    ctx.clearRect(0, 0, W, H);
    const span = 150, ppd = W / span;
    const fs = H * 0.3;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let a = Math.floor((heading - span / 2) / 5) * 5; a <= heading + span / 2; a += 5) {
      const x = W / 2 + (a - heading) * ppd, ang = ((a % 360) + 360) % 360;
      const major = ang % 45 === 0, mid = ang % 15 === 0;
      const fade = 1 - Math.pow(Math.abs(x - W / 2) / (W / 2), 3);
      ctx.globalAlpha = Math.max(0, fade);
      ctx.strokeStyle = major ? '#f6b44f' : 'rgba(255,255,255,.55)'; ctx.lineWidth = Math.max(1, H * 0.018);
      ctx.beginPath(); ctx.moveTo(x, H * (major ? 0.62 : mid ? 0.7 : 0.78)); ctx.lineTo(x, H * 0.9); ctx.stroke();
      if (major) {
        const card = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][ang / 45];
        ctx.fillStyle = card.length === 1 ? '#ffd38a' : '#c9d2e3';
        ctx.font = '700 ' + (card.length === 1 ? fs * 1.15 : fs * 0.85) + 'px Inter, sans-serif';
        ctx.fillText(card, x, H * 0.36);
      }
    }
    ctx.globalAlpha = 1;
    // markers
    const mark = (bearing, color, glyph) => {
      if (bearing == null) return;
      let diff = ((bearing - heading + 540) % 360) - 180;
      const x = W / 2 + diff * ppd;
      const inside = Math.abs(diff) < span / 2 - 4;
      const px = inside ? x : (diff > 0 ? W - H * 0.35 : H * 0.35);
      ctx.fillStyle = color; ctx.globalAlpha = inside ? 1 : 0.55;
      ctx.beginPath();
      if (glyph === 'home') { ctx.moveTo(px, H * 0.18); ctx.lineTo(px + H * 0.17, H * 0.4); ctx.lineTo(px - H * 0.17, H * 0.4); } else { ctx.moveTo(px, H * 0.6); ctx.lineTo(px + H * 0.17, H * 0.28); ctx.lineTo(px - H * 0.17, H * 0.28); }
      ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    };
    mark(d.base_bearing, '#3fe0c5', 'home');
    mark(d.threat && d.threat.nearest && d.threat.nearest.bearing, '#ff5d6c', 'threat');
    // centre caret
    ctx.fillStyle = '#ffd38a';
    ctx.beginPath(); ctx.moveTo(W / 2, H * 0.94); ctx.lineTo(W / 2 - H * 0.07, H); ctx.lineTo(W / 2 + H * 0.07, H); ctx.closePath(); ctx.fill();
    OB.setText(el.deg, String(Math.round(heading)).padStart(3, '0') + '°');
  };

  OB.on('hud', d => { OB.S.hud = d; hud.update(d); });
  OB.on('compass', c => { OB.S.compass = c; hud.compass(c); });
})();
</script>
<script>
/* Toasts + message log. borrowed: overextended/ox_lib/web/src/features/notifications/NotificationWrapper.tsx (LGPL-3.0, private use): the layout pattern ( icon chip, title/description,
   stacked at an edge, auto-dismiss with a progress rule), restyled; the message log feeds the Director drawer. */
(function () {
  'use strict';
  const OB = window.OB, h = OB.h;
  const ICON = { info: 'info', good: 'check', warn: 'alert', bad: 'skull', alert: 'radar' };
  const MAX = 5;

  OB.toast = function (level, text, opts) {
    opts = opts || {};
    level = ICON[level] ? level : 'info';
    const box = OB.$('#toasts');
    if (!box) return;
    // merge identical consecutive toasts (a bleeding colonist should not fill the screen)
    const last = box.lastElementChild;
    if (last && last.dataset.text === text && Date.now() - +last.dataset.at < 4000) {
      const n = (+last.dataset.n || 1) + 1;
      last.dataset.n = n; last.dataset.at = Date.now();
      last.querySelector('.x').textContent = '×' + n; last.querySelector('.x').hidden = false;
      last.classList.remove('out'); clearTimeout(last._t); last._t = setTimeout(() => dismiss(last), ttl(level));
      return;
    }
    const x = h('span.x', { hidden: true }, '');
    const t = h('div.toast.' + level + '.card-in', { role: 'status', dataset: { text, at: Date.now(), n: 1 } },
      h('div.ti', OB.icon(opts.icon || ICON[level])),
      h('div.tb', opts.title ? h('div.tt', opts.title) : null, h('div.tx', text)),
      x,
      h('i.life', { style: { animationDuration: ttl(level) + 'ms' } }));
    t.addEventListener('click', () => dismiss(t));
    box.append(t);
    while (box.children.length > MAX) box.firstElementChild.remove();
    t._t = setTimeout(() => dismiss(t), ttl(level));
  };
  function ttl(level) { return level === 'bad' ? 9000 : level === 'warn' ? 7000 : 5000; }
  function dismiss(t) { clearTimeout(t._t); t.classList.add('out'); setTimeout(() => t.remove(), 260); }

  // message log (kept in the store, shown in the Director drawer)

      for (const z of st.zones) {
        const half = Math.sqrt(z.tiles) * 2.1 * this.s;
        const x = this.sx(z.x), y = this.sy(z.y);
        ctx.fillStyle = z.main ? 'rgba(126,167,255,.10)' : 'rgba(126,224,195,.10)';
        ctx.strokeStyle = z.main ? 'rgba(126,167,255,.6)' : 'rgba(126,224,195,.6)'; ctx.lineWidth = 1.4; ctx.setLineDash([6, 5]);
        ctx.fillRect(x - half, y - half, half * 2, half * 2); ctx.strokeRect(x - half, y - half, half * 2, half * 2); ctx.setLineDash([]);
        if (!mini && this.s > 1.4) {
          const used = z.cap ? z.w / z.cap : 0;
          ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x - half, y + half + 3, half * 2, 3);
          ctx.fillStyle = used > 0.9 ? '#ff5d6c' : '#7aa7ff'; ctx.fillRect(x - half, y + half + 3, half * 2 * Math.min(1, used), 3);
        }
      }
    }
    // zone names are drawn AFTER the buildings and piles (so nothing covers them), on a dark pill, and never over each other: a label that would overlap
    // one already drawn tries the other side of its zone, then is skipped (zoom in to see it)
    drawZoneLabels(ctx, st) {
      if (this.s <= 2.2) return; // at a wider zoom the names would sit on top of the colonists
      const fs = Math.max(10, this.rem * 0.68), placed = [];
      ctx.font = '600 ' + fs + 'px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      for (const z of st.zones) {
        const half = Math.sqrt(z.tiles) * 2.1 * this.s, x = this.sx(z.x), y = this.sy(z.y);
        const text = z.name + '  P' + z.prio, tw = ctx.measureText(text).width;
        for (const below of [false, true]) {
          const base = below ? y + half + 10 + fs : y - half - 5;
          const box = { x0: x - tw / 2 - 5, x1: x + tw / 2 + 5, y0: base - fs - 3, y1: base + 4 };
          if (placed.some(b => box.x0 < b.x1 && box.x1 > b.x0 && box.y0 < b.y1 && box.y1 > b.y0)) continue;
          placed.push(box);
          ctx.fillStyle = 'rgba(8,12,20,.78)'; ctx.fillRect(box.x0, box.y0, box.x1 - box.x0, box.y1 - box.y0);
          ctx.fillStyle = '#c4d2ee'; ctx.fillText(text, x, base);
          break;
        }
      }
    }
    drawExpeditions(ctx, st) {
      const cat = OB.S.catalog; if (!cat || this.mode === 'mini') return;
      const g = cat.tuning.base.garage;
      for (const x of st.expeditions) {
        if (x.state === 'forming') continue;
        const d = cat.districts.find(q => q.id === x.district); if (!d) continue;
        ctx.strokeStyle = 'rgba(102,173,255,.6)'; ctx.lineWidth = 1.6; ctx.setLineDash([3, 7]);
        ctx.beginPath(); ctx.moveTo(this.sx(g.x), this.sy(g.y)); ctx.lineTo(this.sx(d.x), this.sy(d.y)); ctx.stroke(); ctx.setLineDash([]);
        const im = OB.iconImage('truck', '#66adff', () => (this.dirty = true));
        if (im._ok) ctx.drawImage(im, this.sx(d.x) - 11, this.sy(d.y) - 11, 22, 22);
      }
    }
    drawBuildings(ctx, st, mini) {
      const s = this.s;
      const bpS = Math.max(mini ? 4 : 12, Math.min(40, 4.4 * s));
      for (const b of st.buildings) {
        const x = this.sx(b.x), y = this.sy(b.y);
        if (x < -40 || y < -40 || x > this.W + 40 || y > this.H + 40) continue;
        const d = OB.bp(b.bp), col = OB.catColor[d.cat] || '#9aa7bd';
        const built = b.state === 'built';
        const h = bpS / 2;
        if (mini) { ctx.fillStyle = built ? col : col + '66'; ctx.fillRect(x - h / 1.4, y - h / 1.4, h * 1.4, h * 1.4); continue; }
        ctx.save();
        ctx.beginPath(); const rr = Math.min(6, h * 0.35); ctx.roundRect ? ctx.roundRect(x - h, y - h, h * 2, h * 2, rr) : ctx.rect(x - h, y - h, h * 2, h * 2);
        ctx.fillStyle = built ? 'rgba(14,20,30,.92)' : 'rgba(14,20,30,.5)'; ctx.fill();
        ctx.lineWidth = built ? 1.8 : 1.4; ctx.strokeStyle = built ? col : col + 'aa'; if (!built) ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]);
        if (h > 8) { const im = OB.iconImage(OB.bpIcon(b.bp), built ? col : col + '99', () => (this.dirty = true)); if (im._ok) { const q = h * 1.15; ctx.globalAlpha = built ? 1 : 0.8; ctx.drawImage(im, x - q / 2, y - q / 2, q, q); ctx.globalAlpha = 1; } }
        if (!built) { // progress arc + missing materials flag
          ctx.beginPath(); ctx.arc(x, y, h + 3, -1.5708, -1.5708 + 6.2832 * (b.pct / 100)); ctx.strokeStyle = '#35d39a'; ctx.lineWidth = 2.2; ctx.stroke();
          if (b.missing && h > 8) { ctx.fillStyle = '#f5a524'; ctx.beginPath(); ctx.arc(x + h, y - h, 4, 0, 6.2832); ctx.fill(); }
        } else if (b.hp < b.hp_max * 0.995) {
          ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(x - h, y + h + 2, h * 2, 3);
          const f = b.hp / b.hp_max; ctx.fillStyle = f < 0.35 ? '#ff5d6c' : f < 0.7 ? '#f5a524' : '#35d39a'; ctx.fillRect(x - h, y + h + 2, h * 2 * f, 3);
        }
        if (built && d.power_use > 0 && !b.powered) { ctx.fillStyle = '#ff5d6c'; ctx.beginPath(); ctx.arc(x + h, y - h, 4.2, 0, 6.2832); ctx.fill(); }
        if (this.hover && this.hover.kind === 'building' && this.hover.id === b.id) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.strokeRect(x - h - 3, y - h - 3, h * 2 + 6, h * 2 + 6); }
        ctx.restore();
      }
    }
    drawPiles(ctx, st) {
      if (this.s < 1.4) return;
      for (const p of st.piles) { const x = this.sx(p.x), y = this.sy(p.y); ctx.fillStyle = '#d7a36e'; ctx.fillRect(x - 5, y - 5, 10, 10); ctx.strokeStyle = '#2a1c0c'; ctx.lineWidth = 1.2; ctx.strokeRect(x - 5, y - 5, 10, 10); if (this.s > 3) { ctx.fillStyle = '#e9d3b4'; ctx.font = '600 10px Inter'; ctx.textAlign = 'center'; ctx.fillText(p.n, x, y + 17); } }
    }
    drawCaravans(ctx, st) {
      for (const c of st.caravans) {
        const x = this.sx(c.x), y = this.sy(c.y);
        ctx.beginPath(); ctx.arc(x, y, 13, 0, 6.2832); ctx.fillStyle = 'rgba(246,208,77,.15)'; ctx.fill(); ctx.strokeStyle = FAC[c.faction] || '#f6d04d'; ctx.lineWidth = 2; ctx.stroke();
        const im = OB.iconImage('trade', '#f6d04d', () => (this.dirty = true)); if (im._ok) ctx.drawImage(im, x - 8, y - 8, 16, 16);
        if (this.mode !== 'mini' && this.s > 1) { ctx.fillStyle = '#f6d04d'; ctx.font = '600 ' + Math.max(10, this.rem * 0.68) + 'px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(c.name + ' · ' + OB.fmt.dur(c.leave_in), x, y + 17); }
      }
    }
    drawHordes(ctx, st, mini) {
      const t = performance.now();
      for (const hd of st.hordes) {
        const x = this.sx(hd.x), y = this.sy(hd.y);
        if (x < -80 || y < -80 || x > this.W + 80 || y > this.H + 80) continue;
        const assault = hd.state === 'assault';
        const rWorld = 5 + Math.sqrt(hd.size) * 2.1;
        const r = Math.max(mini ? 6 : 15, rWorld * this.s);
        const col = assault ? '#ff3b4d' : hd.mat > 0 ? '#ff7a3d' : '#ff5d6c';
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, col + (assault ? '88' : '55')); g.addColorStop(1, col + '00');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.25, 0, 6.2832); ctx.fill();
        if (this.s > 2.2 && !mini) { // individual shamblers
          const rnd = hashRand(hd.id); ctx.fillStyle = col;
          for (let i = 0; i < Math.min(hd.size, 60); i++) { const a = rnd() * 6.2832, d = Math.sqrt(rnd()) * rWorld; ctx.fillRect(x + Math.cos(a) * d * this.s - 1.5, y - Math.sin(a) * d * this.s - 1.5, 3, 3); }
        }
        ctx.beginPath(); ctx.arc(x, y, Math.max(mini ? 4 : 11, r * 0.5), 0, 6.2832); ctx.fillStyle = 'rgba(40,6,12,.82)'; ctx.fill();
        ctx.lineWidth = hd.mat > 0 ? 2.4 : 1.6; ctx.strokeStyle = col; if (hd.mat <= 0) ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
        if (assault) { ctx.beginPath(); ctx.arc(x, y, r * (0.8 + 0.25 * ((t % 1200) / 1200)), 0, 6.2832); ctx.strokeStyle = 'rgba(255,59,77,' + (0.7 - 0.6 * ((t % 1200) / 1200)) + ')'; ctx.lineWidth = 2; ctx.stroke(); }
        if (!mini) {
          ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '700 ' + Math.max(11, Math.min(18, r * 0.5)) + 'px "Barlow Condensed", Inter';
          ctx.fillText(hd.size, x, y + 1);
          if (r > 22) { ctx.font = '600 ' + Math.max(9, this.rem * 0.62) + 'px Inter'; ctx.fillStyle = col; ctx.textBaseline = 'top'; ctx.fillText(assault ? 'ASSAULT' : hd.mat > 0 ? 'LIVE ' + hd.mat : hd.state.toUpperCase(), x, y + r * 0.62); }
          if (hd.state === 'seek' || hd.state === 'wander') { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + hd.hx * r * 0.55, y - hd.hy * r * 0.55); ctx.lineTo(x + hd.hx * r * 1.25, y - hd.hy * r * 1.25); ctx.stroke(); }
        }
      }
    }
    drawRaids(ctx, st) {
      for (const r of st.raids) {
        const x = this.sx(r.x), y = this.sy(r.y), c = FAC[r.faction] || '#ff5d6c';
        ctx.beginPath(); ctx.moveTo(x, y - 14); ctx.lineTo(x + 12, y + 9); ctx.lineTo(x - 12, y + 9); ctx.closePath();
        ctx.fillStyle = 'rgba(20,8,10,.9)'; ctx.fill(); ctx.strokeStyle = c; ctx.lineWidth = 2.2; ctx.stroke();
        ctx.fillStyle = c; ctx.font = '700 12px "Barlow Condensed", Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(r.count, x, y + 2);
        if (this.mode !== 'mini') { ctx.font = '600 ' + Math.max(10, this.rem * 0.66) + 'px Inter'; ctx.textBaseline = 'top'; ctx.fillText(r.name, x, y + 14); }
      }
    }
    drawColonists(ctx, st, mini) {
      const s = this.s, R = mini ? 5 : OB.clamp(2.3 * s, 12, 21);
      const sel = new Set(OB.S.sel);
      for (const c of st.colonists) {
        if (c.state === 'away') continue;
        const x = this.sx(c.x), y = this.sy(c.y);
        if (x < -30 || y < -30 || x > this.W + 30 || y > this.H + 30) continue;
        const col = c.downed ? STATE_COL.downed : c.drafted ? STATE_COL.drafted : STATE_COL[c.state] || '#9aa7bd';
        const isSel = sel.has(c.id), primary = OB.S.primary === c.id;
        if (mini) { ctx.beginPath(); ctx.arc(x, y, R, 0, 6.2832); ctx.fillStyle = col; ctx.fill(); if (isSel) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke(); } continue; }
        if (isSel) { ctx.beginPath(); ctx.arc(x, y, R + 5, 0, 6.2832); ctx.strokeStyle = primary ? '#ffd38a' : '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
        if (c.drafted) { ctx.beginPath(); ctx.arc(x, y, R + 2.5, 0, 6.2832); ctx.strokeStyle = '#f6b44f'; ctx.lineWidth = 1.5; ctx.stroke(); }
        ctx.beginPath(); ctx.arc(x, y, R, 0, 6.2832); ctx.fillStyle = 'rgba(12,17,26,.95)'; ctx.fill();
        ctx.lineWidth = 2.4; ctx.strokeStyle = col; ctx.stroke();
        // mood arc
        ctx.beginPath(); ctx.arc(x, y, R - 3.4, -1.5708, -1.5708 + 6.2832 * (c.mood / 100)); ctx.strokeStyle = c.mood < 30 ? '#ff5d6c' : c.mood < 45 ? '#f5a524' : '#35d39a'; ctx.lineWidth = 1.6; ctx.stroke();
        ctx.fillStyle = '#eaf0f9'; ctx.font = '700 ' + Math.round(R * 0.78) + 'px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(OB.initials(c.name)[0], x, y + 0.5);
        if (c.hp < c.hp_max * 0.98) { ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x - R, y + R + 3, R * 2, 3); ctx.fillStyle = c.hp / c.hp_max < 0.35 ? '#ff5d6c' : '#35d39a'; ctx.fillRect(x - R, y + R + 3, R * 2 * (c.hp / c.hp_max), 3); }
        if (c.bleeding > 0.02) { ctx.fillStyle = '#ff3b5c'; ctx.beginPath(); ctx.arc(x + R, y - R, 3.2, 0, 6.2832); ctx.fill(); }
        if ((isSel || (this.hover && this.hover.id === c.id) || s > 6) && this.layers.labels) {
          ctx.font = '600 ' + Math.max(10, this.rem * 0.7) + 'px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          const nm = OB.nick(c.name), tw = ctx.measureText(nm).width;
          ctx.fillStyle = 'rgba(8,12,20,.8)'; ctx.fillRect(x - tw / 2 - 5, y - R - 20, tw + 10, 16);
          ctx.fillStyle = '#eaf0f9'; ctx.fillText(nm, x, y - R - 7);
        }
      }
    }
    drawPlayer(ctx, st) {
      if (!st.player) return;
      const x = this.sx(st.player.x), y = this.sy(st.player.y);
      ctx.save(); ctx.translate(x, y);
      ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(8, 9); ctx.lineTo(0, 5); ctx.lineTo(-8, 9); ctx.closePath();
      ctx.fillStyle = '#3fe0c5'; ctx.shadowColor = '#3fe0c5'; ctx.shadowBlur = 8; ctx.fill(); ctx.restore();
    }
    drawGhost(ctx) {
      const g = this.ghost; if (g.x == null) return;
      if (g.zone) {
        const x = this.sx(g.x), y = this.sy(g.y), half = Math.sqrt(g.tiles) * 2.1 * this.s;
        ctx.fillStyle = 'rgba(126,224,195,.16)'; ctx.strokeStyle = '#7ee0c3'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]); ctx.fillRect(x - half, y - half, half * 2, half * 2); ctx.strokeRect(x - half, y - half, half * 2, half * 2); ctx.setLineDash([]);
        return;
      }
      const x = this.sx(g.x), y = this.sy(g.y), d = OB.bp(g.bp), h = Math.max(12, Math.min(40, 4.4 * this.s)) / 2;
      const col = g.ok ? '#35d39a' : '#ff5d6c';
      ctx.fillStyle = g.ok ? 'rgba(53,211,154,.18)' : 'rgba(255,93,108,.18)'; ctx.fillRect(x - h, y - h, h * 2, h * 2);
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.strokeRect(x - h, y - h, h * 2, h * 2); ctx.setLineDash([]);
      const im = OB.iconImage(OB.bpIcon(g.bp), col, () => (this.dirty = true)); if (im._ok) ctx.drawImage(im, x - h * 0.6, y - h * 0.6, h * 1.2, h * 1.2);
      ctx.font = '600 ' + Math.max(11, this.rem * 0.75) + 'px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      const label = d.name + (g.ok ? '' : ' — ' + OB.reason(g.reason));
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = 'rgba(8,12,20,.85)'; ctx.fillRect(x - tw / 2 - 6, y + h + 5, tw + 12, 20); ctx.fillStyle = col; ctx.fillText(label, x, y + h + 9);
      // snap guide lines to the base
      ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.setLineDash([2, 6]); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.H); ctx.moveTo(0, y); ctx.lineTo(this.W, y); ctx.stroke(); ctx.setLineDash([]);
    }
    drawPings(ctx) {
      const now = performance.now();
      this.pings = this.pings.filter(p => now - p.t < 900);
      for (const p of this.pings) {
        const k = (now - p.t) / 900;
        ctx.beginPath(); ctx.arc(this.sx(p.x), this.sy(p.y), 6 + 26 * k, 0, 6.2832); ctx.strokeStyle = (p.c || '#ffd38a'); ctx.globalAlpha = 1 - k; ctx.lineWidth = 2.5; ctx.stroke(); ctx.globalAlpha = 1;
      }
    }
    drawScale(ctx, W, H, rem) {
      // scale bar + north marker (bottom-right)
      const steps = [5, 10, 20, 50, 100, 200, 500, 1000, 2000];
      const u = steps.find(v => v * this.s >= 90) || 2000, px = u * this.s;
      const x = W - rem * 1.5 - px, y = H - rem * 1.6;
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y - 5); ctx.lineTo(x, y); ctx.lineTo(x + px, y); ctx.lineTo(x + px, y - 5); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = '600 ' + Math.max(10, rem * 0.72) + 'px Inter'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText(u + ' m', x + px, y - 8);
    }
  }
  OB.MapView = MapView;
  // registry so main.js can push every state update to every live view (hidden ones just mark themselves dirty)
  OB.map = { views: [], reg(v) { this.views.push(v); return v; }, updateAll(st) { for (const v of this.views) v.setState(st); } };
})();
</script>
<script>
/* Colony mode chrome: top resource bar + time controls + threat meter, colonist roster, dock (colonist card / build / zones / expeditions /
   director), command bar, minimap and the world layer. All DOM is created once; updates only touch changed text/styles (see OB.setText). */
(function () {
  'use strict';
  const OB = window.OB, h = OB.h, S = OB.S, F = OB.fmt;
  const colony = (OB.colony = {});
  const el = {};
  let rows = new Map();
  const WORK = ['doctor', 'guard', 'build', 'cook', 'craft', 'haul', 'scavenge'];
  const WORK_LABEL = { doctor: 'Doctor', guard: 'Guard', build: 'Build', cook: 'Cook', craft: 'Craft', haul: 'Haul', scavenge: 'Scavenge' };
  OB.WORK_LABEL = WORK_LABEL;

  const moodColor = m => (m >= 65 ? '#35d39a' : m >= 45 ? '#9bd34f' : m >= 30 ? '#f5a524' : '#ff5d6c');
  OB.moodColor = moodColor;
  const STATE_COL = { idle: '#94a1b7', working: '#6ea8ff', sleeping: '#8b7bff', guarding: '#35d39a', drafted: '#f6b44f', downed: '#ff5d6c', away: '#62708a' };
  OB.stateColor = s => STATE_COL[s] || '#94a1b7';

  // ------------------------------------------------------------------------------------------------------------------ top bar
  const RES = [
    { id: 'colonists', icon: 'people', label: 'Colony' },
    { id: 'food', icon: 'food', label: 'Food' },
    { id: 'water', icon: 'drop', label: 'Water' },
    { id: 'medical', icon: 'cross', label: 'Medical' },
    { id: 'ammo', icon: 'ammo', label: 'Ammo' },
    { id: 'fuel', icon: 'fuel', label: 'Fuel' },
    { id: 'material', icon: 'gear', label: 'Materials' },
    { id: 'power', icon: 'bolt', label: 'Power' },
    { id: 'wealth', icon: 'star', label: 'Wealth' },
  ];

  function buildTopbar() {
    const bar = OB.$('#topbar');
    OB.clear(bar);
    bar.className = 'panel';
    const brand = h('div.brand', OB.icon('bio'), h('div', h('b', 'OUTBREAK'), h('small', 'Colony')));
    const res = h('div.resources');
    el.res = {};
    for (const r of RES) {
      const v = h('div.rv.num', '-'), sub = h('div.rs', '');
      const bar2 = OB.bar('thin');
      const node = h('div.res', { dataset: { id: r.id }, tabindex: 0 }, h('div.ri', OB.icon(r.icon)), h('div.rt', h('div.rl', r.label), v, sub), bar2);
      node.v = v; node.s = sub; node.b = bar2;
      el.res[r.id] = node;
      res.append(node);
    }
    OB.tip(el.res.food, () => { const r = S.state && S.state.res; return r ? '<div class="tt-h">Food</div><div class="tt-r"><span>Meals in stock</span><span>' + r.food + '</span></div><div class="tt-r"><span>Enough for</span><span>' + r.food_days.toFixed(1) + ' days</span></div><div class="tt-r"><span>Colonists</span><span>' + r.colonists + '</span></div><div style="margin-top:.4rem" class="muted">Scavenge, trade or wait for supply drops: there is no farming.</div>' : ''; });
    OB.tip(el.res.water, () => { const r = S.state && S.state.res; return r ? '<div class="tt-h">Water</div><div class="tt-r"><span>Bottles</span><span>' + r.bottled + '</span></div><div class="tt-r"><span>Tank</span><span>' + r.water_tank.toFixed(0) + ' / ' + r.tank_cap.toFixed(0) + ' L</span></div><div class="tt-r"><span>Mains</span><span>' + (r.mains_water ? 'running' : 'dead') + '</span></div>' : ''; });
    OB.tip(el.res.power, () => { const r = S.state && S.state.res; return r ? '<div class="tt-h">Power</div><div class="tt-r"><span>Supply</span><span>' + F.n(r.power_supply) + ' W</span></div><div class="tt-r"><span>Demand</span><span>' + F.n(r.power_demand) + ' W</span></div><div class="tt-r"><span>City grid</span><span>' + (r.mains_power ? 'up' : 'down') + '</span></div>' : ''; });
    OB.tip(el.res.colonists, () => { const r = S.state && S.state.res; return r ? '<div class="tt-h">Colony</div><div class="tt-r"><span>Average mood</span><span>' + Math.round(r.mood) + '%</span></div><div class="tt-r"><span>Injured</span><span>' + r.hurt + '</span></div><div class="tt-r"><span>Beds</span><span>' + S.state.beds + '</span></div><div class="tt-r"><span>Defense</span><span>' + r.defense + '</span></div><div class="tt-r"><span>Wall enclosure</span><span>' + Math.round(r.enclosure * 100) + '%</span></div>' : ''; });
    OB.tip(el.res.wealth, () => '<div class="tt-h">Wealth</div><div class="muted">Stockpile + buildings. The Director scales threats with it.</div>');

    el.day = h('div.disp.num', 'Day 1'); el.clockN = h('div.time.disp.num', '08:00'); el.season = h('div.lbl', 'Spring');
