<!doctype html>
<html lang="en" data-mode="survival">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outbreak UI</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/colony.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>
<!-- Outbreak NUI. Vanilla HTML/CSS/JS, no CDN, no build step. Scripts talk to the game only through OB.post() / window "message" events
     (see js/core.js). In the browser preview the same page runs inside preview/index.html with a fake bridge. -->
<div id="app">
  <div id="vignette" aria-hidden="true"></div>
  <div id="preview-badge" hidden>PREVIEW &middot; no GTA &middot; live Lua sim</div>

  <!-- survival HUD -->
  <section id="hud" aria-label="Survival HUD"></section>

  <!-- colony mode chrome -->
  <section id="colony" aria-label="Colony view" hidden>
    <div id="mapbg" hidden></div>
    <header id="topbar"></header>
    <aside id="roster"></aside>
    <aside id="dock"></aside>
    <nav id="cmdbar" aria-label="Commands"></nav>
    <div id="minimap"></div>
  </section>

  <!-- modal screens -->
  <div id="screens"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="tip" role="tooltip" hidden></div>
  <div id="ctx" hidden></div>
  <div id="dragghost" hidden></div>
</div>

<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/hud.js"></script>
<script src="js/toasts.js"></script>
<script src="js/map.js"></script>
<script src="js/colony.js"></script>
<script src="js/inventory.js"></script>
<script src="js/priorities.js"></script>
<script src="js/build.js"></script>
<script src="js/zones.js"></script>
<script src="js/exped.js"></script>
<script src="js/director.js"></script>
<script src="js/menu.js"></script>
<script src="js/mapscreen.js"></script>
<script src="js/main.js"></script>
</body>
</html>
