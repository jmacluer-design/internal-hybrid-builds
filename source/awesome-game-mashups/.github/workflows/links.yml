name: Check links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths: ['data/**', 'scripts/check_links.py', '.github/workflows/links.yml']

permissions:
  contents: read

concurrency:
  group: link-audit
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit public source reachability without credentials
        run: |
          python3 scripts/migrate_catalogue.py
          python3 scripts/check_links.py
      - name: Preserve every URL result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: link-reachability
          path: build/link-report.json
          retention-days: 14
          if-no-files-found: error
