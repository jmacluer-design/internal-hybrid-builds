name: Catalogue integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: |
          python3 scripts/catalogue.py validate
          python3 scripts/catalogue.py check
          python3 -m unittest discover -s tests -v

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      head: ${{ steps.head.outputs.sha }}
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Migrate once, validate and generate
        run: |
          python3 scripts/migrate_catalogue.py
          python3 scripts/catalogue.py build
          python3 -m unittest discover -s tests -v
          python3 scripts/catalogue.py check
      - name: Publish generated catalogue files atomically
        run: |
          git add data/projects.json README.md docs/promote/weekly-digest.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: regenerate catalogue views from canonical data'
            git push origin HEAD:main
          fi
          python3 scripts/catalogue.py check
      - name: Record exact built source
        id: head
        run: |
          mkdir -p build
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > build/source-commit.txt
          cp _site/build-info.json build/build-info.json
          git archive --format=tar.gz -o build/catalogue-source.tar.gz HEAD
          tar -czf build/website.tar.gz -C _site .
          cat _site/build-info.json >> "$GITHUB_STEP_SUMMARY"
      - name: Check whether owner has enabled Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages')
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != true ]; then
            echo 'Site build ready. Owner setup still required: Settings → Pages → Source → GitHub Actions. No live deployment is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload source and website builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalogue-build
          path: build/
          retention-days: 14
          if-no-files-found: error
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.head }}
          persist-credentials: false
      - run: |
          python3 scripts/catalogue.py check
          python3 -m venv /tmp/browser-test
          /tmp/browser-test/bin/pip install -r tests/browser-requirements.txt
          /tmp/browser-test/bin/python -m playwright install --with-deps chromium
          /tmp/browser-test/bin/python tests/browser_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-report
          path: build/browser/
          retention-days: 14
          if-no-files-found: warn

  deploy:
    needs: [build, browser]
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
