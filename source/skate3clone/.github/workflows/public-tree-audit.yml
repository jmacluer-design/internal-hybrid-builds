name: Public tree audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q tools
      - run: python tools/audit_public_tree.py --distribution
