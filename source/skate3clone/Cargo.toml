[package]
name = "skate3_bevy"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "0.18.1", features = ["dynamic_linking"] }
flate2 = "1.1"
half = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
libloading = "0.8.9"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
