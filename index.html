<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>internal hybrid builds · artifact shelf</title>
<style>
:root{--bg:#08070f;--card:#141322;--border:#2b2944;--foreground:#eceaf6;--muted-foreground:#9895b4;--accent:#8f7cf8;--radius:10px;}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--foreground);font-family:system-ui,-apple-system,sans-serif;font-size:14px;}
.wrap{display:flex;flex-direction:column;gap:14px;padding:20px 22px;max-width:1100px;}
.k{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-foreground);margin:0 0 8px;}
.artifact-library{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.artifact-library>summary{font-weight:700;color:var(--foreground);cursor:pointer;}
.artifact-list{display:flex;flex-direction:column;gap:12px;}
.artifact-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:6px;}
.artifact-card:hover{border-color:var(--accent);}
.artifact-kicker{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted-foreground);}
.artifact-card strong{font-size:18px;font-weight:700;}
.artifact-card p{font-size:12px;color:var(--muted-foreground);line-height:1.5;}
.artifact-actions{display:flex;gap:8px;flex-wrap:wrap;}
.artifact-actions>button{font-family:inherit;font-size:12px;background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;}
.artifact-actions>button:hover{border-color:var(--accent);color:var(--accent);}
.artifact-actions>button[data-artifact-open]{background:var(--accent);color:var(--bg);border:1px solid var(--accent);font-weight:700;}
.artifact-actions>button[data-artifact-open]:hover{filter:brightness(1.15);}
.artifact-technical{font-size:12px;}
.artifact-technical>summary{color:var(--muted-foreground);}
.artifact-technical small{display:block;font-size:11px;color:var(--muted-foreground);}
.artifact-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.artifact-filters input[type=search]{font-family:inherit;background:var(--bg);color:var(--foreground);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-width:180px;}
.artifact-filters select{font-family:inherit;background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:8px;}
.artifact-filters small{font-size:11px;color:var(--muted-foreground);}
.artifact-card.hidden-search{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="k" id="kicker">internal hybrid builds · artifact shelf</div>
  <details class="artifact-library" open>
    <summary>Artifact library</summary>
    <div class="artifact-filters">
      <input type="search" placeholder="Find saved work…" aria-label="Search artifact library" id="q">
      <select aria-label="Filter builds" id="owner"><option value="all">All builds</option></select>
      <small id="count">…</small>
    </div>
    <div class="artifact-list" id="listing"></div>
  </details>
  <details class="artifact-library" id="archiveBox">
    <summary>Archive</summary>
    <div class="artifact-list" id="archiveListing" style="margin-top:12px"></div>
  </details>
</div>
<script>
const API = location.origin;
const BUILD = '__BUILD__'; // stamped by deploy.sh; busts edge caches so a new build never serves a stale copy
const SUPA = (()=>{ try{ const v=localStorage.getItem('ib_supa'); return v?JSON.parse(v):null; }catch(e){ return null; } })();
const games = [
 {id:'souls64', name:'SOULS 64', desc:'one arena, one boss, a hero who moves like 1996 · triple jump, wall kick, ground pound vs. Orrun the Gatekeeper · Xbox/PS pad', file:'games/souls64.html', bytes:195249},
 {id:'parkcraft', name:'PARKCRAFT', desc:'build the park, then shred it · push, carve, ollie, flip tricks, grinds, manuals · block-style park builder · Xbox/PS pad', file:'games/parkcraft.html', bytes:163326},
 {id:'neondrift', name:'NEONDRIFT', desc:'synthwave hover-skiff runner · rings, shards, boost', file:'games/archive/neondrift.html', bytes:25729, archived:true},
 {id:'blockshot-v1', name:'BLOCKSHOT v1', desc:'MW2 × Minecraft × SM64 × Skate3 prototype · superseded by the rebuild', file:'games/archive/blockshot-v1.html', bytes:23873, archived:true},
];
const listing = document.getElementById('listing');
const archiveListing = document.getElementById('archiveListing');

function card(g, save){
  const section=document.createElement('article'); section.className='artifact-card'; section.dataset.artifact=g.id;
  const kicker=document.createElement('small'); kicker.className='artifact-kicker';
  kicker.textContent=(g.archived?'ARCHIVED · ':'')+((save&&save.best)?'GAME · SAVED · BEST '+save.best:'GAME · HYBRID BUILD');
  const title=document.createElement('strong'); title.textContent=g.name;
  const summary=document.createElement('p'); summary.textContent=g.desc;
  const actions=document.createElement('div'); actions.className='artifact-actions';
  const play=document.createElement('button'); play.type='button'; play.textContent='Play artifact';
  play.dataset.artifactOpen='true';
  play.addEventListener('click',()=>{
    const url=g.file+'?v='+BUILD;
    const w=window.open(url,'_hermes','');
    if(!w){ location.href=url; }
  });
  actions.append(play);
  const technical=document.createElement('details'); technical.className='artifact-technical';
  const tlabel=document.createElement('summary'); tlabel.textContent='Details & verification';
  const info=document.createElement('small');
  info.textContent=(g.kind||'game')+' · '+g.id.slice(0,12)+' · 1 file · '+(g.bytes/1024).toFixed(1)+' KB';
  const status=document.createElement('small');
  status.textContent=(save&&save.best)?('best '+save.best+' · '+(save.synced||'local')):(save&&save.score)?('last run '+save.score):(g.saveNote||'no save yet');
  technical.append(tlabel,info,status);
  section.append(kicker,title,summary,actions,technical);
  return section;
}

function render(saves){
  listing.replaceChildren(); archiveListing.replaceChildren();
  games.forEach(g=>{ const s=(saves||{})[g.id]||{}; g.save=s; (g.archived?archiveListing:listing).append(card(g,s)); });
  if(!listing.children.length){ const e=document.createElement('p'); e.className='k'; e.textContent='No active builds right now — new ones are on the way.'; listing.append(e); }
  document.getElementById('owner').replaceChildren(
    (()=>{const o=document.createElement('option');o.value='all';o.textContent='All builds';return o;})(),
    ...games.map(g=>{const o=document.createElement('option');o.value=g.id;o.textContent=g.name;return o;}));
  filter();
}
function filter(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const owner=document.getElementById('owner').value;
  let n=0;
  document.querySelectorAll('.artifact-card').forEach(c=>{
    const g=games.find(x=>x.id===c.dataset.artifact);
    const hay=(g.name+' '+g.desc+' '+g.id).toLowerCase();
    const ok=(owner==='all'||owner===g.id)&&hay.includes(q);
    c.classList.toggle('hidden-search',!ok); if(ok)n++;
  });
  const act=games.filter(g=>!g.archived).length;
  document.getElementById('count').textContent=n+' matches · '+act+' on shelf · '+(games.length-act)+' archived';
}
document.getElementById('q').addEventListener('input',filter);
document.getElementById('owner').addEventListener('change',filter);

function done(s){
  window.__SAVES=s;
  render(s);
}
fetch(API+'/api/saves').then(r=>r.json()).then(done).catch(()=>{
  if(SUPA){ fetch(SUPA.url+'/rest/v1/ib_saves?select=*',{headers:{'apikey':SUPA.key}})
    .then(r=>r.json()).then(rows=>{ done(rows.reduce((a,r)=>{a[r.game]=r.data;return a;},{})); })
    .catch(()=>done(JSON.parse(localStorage.getItem('ib_saves')||'{}'))); }
  else done(JSON.parse(localStorage.getItem('ib_saves')||'{}'));
});
</script>
</body>
</html>
